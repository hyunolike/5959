name: Release

# API를 Render에 배포한다(018 US2, research R9). 필요할 때만 손으로 실행한다.
# 1. release-please가 버전을 정한다.
# 2. 기동 캐시(AOT)를 담은 linux/amd64 이미지를 만들어 GHCR에 올린다(infra/render/scripts/build-image.sh).
# 3. Render API로 그 이미지의 digest를 지정해 배포를 건다. 배포 훅은 응답 모양을 API로 확인할 수 없어 쓰지 않는다.
# 4. 그 배포가 live가 될 때까지 Render API로 기다린다. Render는 새 인스턴스가 뜰 때까지 옛 인스턴스로 요청을
#    받으므로, liveness만 보면 새 버전이 뜨기 전에도 성공으로 보인다.
#
# 저장소 비밀값: RENDER_API_KEY, RENDER_SERVICE_ID (infra/render/README.md)
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      api_release: ${{ steps.rp.outputs['apps/api--release_created'] }}
      api_version: ${{ steps.rp.outputs['apps/api--version'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  api-image:
    needs: release-please
    if: needs.release-please.outputs.api_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew bootJar
        working-directory: apps/api
      - name: 기동 캐시를 담은 이미지 빌드
        run: infra/render/scripts/build-image.sh ogu-api:release linux/amd64
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: GHCR에 올리기
        id: push
        env:
          VERSION: ${{ needs.release-please.outputs.api_version }}
        run: |
          repo=ghcr.io/hyunolike/5959-api
          docker tag ogu-api:release "$repo:$VERSION"
          docker tag ogu-api:release "$repo:latest"
          docker push "$repo:$VERSION"
          docker push "$repo:latest"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$repo:$VERSION")"
          echo "image=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: api-image
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions: {}
    steps:
      - name: Render에 배포 걸기
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          IMAGE: ${{ needs.api-image.outputs.image }}
        run: |
          response="$(curl -fsS -X POST -H "Authorization: Bearer $RENDER_API_KEY" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg image "$IMAGE" '{imageUrl: $image}')" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys")"
          deploy_id="$(jq -r '.id' <<<"$response")"
          if [[ -z "$deploy_id" || "$deploy_id" == "null" ]]; then
            echo "Render 응답에 배포 id가 없습니다" >&2
            exit 1
          fi
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
      - name: 배포가 live가 될 때까지 기다리기 (최대 15분)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: |
          # CPU 0.1개에서 기동에 4분쯤 걸린다(research R1). 이미지를 받는 시간까지 넉넉히 둔다.
          for _ in $(seq 1 90); do
            status="$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" | jq -r '.status')"
            echo "배포 상태: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed)
                echo "배포가 실패했습니다: $status" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "15분 안에 live가 되지 않았습니다" >&2
          exit 1
