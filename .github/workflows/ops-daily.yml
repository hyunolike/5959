name: Ops daily

# 018 research R10: 매일 한 번 Neon을 백업하고 무료 한도 사용량을 본다. 어느 단계든 실패하면 워크플로가 실패하고
# GitHub이 저장소 소유자에게 메일을 보낸다.
# - 백업: Neon 직접 연결로 pg_dump -Fc → Cloudflare R2 `ogu-backup/postgres/<날짜>.dump`.
#   14일보다 오래된 덤프는 R2 수명 주기 규칙이 지운다(infra/render/README.md).
# - 사용량: Neon API의 compute_time_seconds와 synthetic_storage_size가 무료 한도의 70%를 넘으면 실패.
# - 손으로 실행할 때 restore_drill을 켜면 최신 덤프를 빈 Postgres에 되살리고 테이블마다 행 수를 출력한다.
#
# 비밀값: NEON_DIRECT_URL, NEON_API_KEY, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
# 변수: NEON_PROJECT_ID, R2_ACCOUNT_ID
on:
  schedule:
    # 03:30 KST. 백업과 점검이 같은 시각에 돌아 DB를 하루 한 번만 깨운다.
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      restore_drill:
        description: 최신 덤프를 빈 Postgres에 되살려 행 수를 확인한다
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ops-daily
  cancel-in-progress: false

env:
  BUCKET: ogu-backup
  PG_IMAGE: pgvector/pgvector:pg17

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: 덤프
        env:
          NEON_DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}
        run: |
          # 잠든 DB가 깨어나는 데 몇 초 걸린다. 연결 시간 제한을 넉넉히 둔다.
          docker run --rm -e PGCONNECT_TIMEOUT=30 -e NEON_DIRECT_URL "$PG_IMAGE" \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges "$NEON_DIRECT_URL"' > backup.dump
          size="$(stat -c %s backup.dump)"
          echo "덤프 크기: $size 바이트"
          # 스키마만 있어도 수십 KB다. 이보다 작으면 덤프가 깨진 것이다.
          if (( size < 10000 )); then
            echo "덤프가 너무 작습니다" >&2
            exit 1
          fi
      - name: R2에 올리기
        run: |
          key="postgres/$(date -u +%Y-%m-%d).dump"
          aws s3 cp backup.dump "s3://$BUCKET/$key" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          echo "올림: $BUCKET/$key"

  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Neon 무료 한도 사용량
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          # 무료 플랜: 한 달 100 CU-시간, 저장 0.5GB. 저장 한도는 research R10의 1GB보다 낮게 잡아 일찍 알린다.
          CU_HOURS_LIMIT: "100"
          STORAGE_BYTES_LIMIT: "536870912"
        run: |
          project="$(curl -fsS -H "Authorization: Bearer $NEON_API_KEY" -H 'Accept: application/json' \
            "https://console.neon.tech/api/v2/projects/$PROJECT_ID" | jq '.project')"
          compute="$(jq -r '.compute_time_seconds // 0' <<<"$project")"
          storage="$(jq -r '.synthetic_storage_size // 0' <<<"$project")"
          cu_pct=$(( compute * 100 / (CU_HOURS_LIMIT * 3600) ))
          storage_pct=$(( storage * 100 / STORAGE_BYTES_LIMIT ))
          echo "이번 달 컴퓨트: $(( compute / 60 ))분 (${cu_pct}%), 저장: $(( storage / 1048576 ))MB (${storage_pct}%)"
          if (( cu_pct >= 70 || storage_pct >= 70 )); then
            echo "Neon 무료 한도의 70%를 넘었습니다" >&2
            exit 1
          fi

  restore-drill:
    if: github.event_name == 'workflow_dispatch' && inputs.restore_drill
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: drill
          POSTGRES_USER: drill
          POSTGRES_PASSWORD: drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drill -d drill"
          --health-interval 5s
          --health-retries 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: 최신 덤프 받기
        run: |
          latest="$(aws s3 ls "s3://$BUCKET/postgres/" --endpoint-url "$R2_ENDPOINT" | sort | tail -n 1 | awk '{print $4}')"
          echo "되살릴 덤프: $latest"
          aws s3 cp "s3://$BUCKET/postgres/$latest" latest.dump --endpoint-url "$R2_ENDPOINT" --only-show-errors
      - name: 되살리고 행 수 보기
        run: |
          docker run --rm --network host -v "$PWD:/work" -e PGPASSWORD=drill "$PG_IMAGE" sh -c '
            psql -h localhost -U drill -d drill -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector" &&
            pg_restore -h localhost -U drill -d drill --no-owner --no-privileges /work/latest.dump &&
            psql -h localhost -U drill -d drill -At -c "
              SELECT table_name FROM information_schema.tables
              WHERE table_schema = '"'"'public'"'"' AND table_name <> '"'"'flyway_schema_history'"'"'
              ORDER BY table_name" |
            while read -r t; do
              printf "%s\t%s\n" "$t" "$(psql -h localhost -U drill -d drill -At -c "SELECT count(*) FROM \"$t\"")"
            done'
