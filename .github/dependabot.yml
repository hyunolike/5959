version: 2
updates:
  - package-ecosystem: gradle
    directory: /apps/api
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      # 관련 의존성을 하나의 PR로 묶어 리뷰 부담을 줄인다
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      spring:
        patterns:
          - "org.springframework*"

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
