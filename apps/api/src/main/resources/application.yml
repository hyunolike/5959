server:
  # X-Forwarded-For 등으로 request.remoteAddr가 바뀌지 않게 한다. 클라이언트 IP는 BffClientIpResolver가 BFF 키를 확인한
  # X-Ogu-Client-Ip로만 정한다.
  forward-headers-strategy: none

spring:
  application:
    name: ogu-api
  profiles:
    default: local # SPRING_PROFILES_ACTIVE 미지정 시(로컬 실행, 테스트) local을 기본으로 쓴다
  jpa:
    hibernate:
      ddl-auto: validate # 스키마는 Flyway만 바꾼다
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  task:
    execution:
      # 004부터 모듈이 자기 실행기 빈(알림 신호, SSE 쓰기)을 두므로, 그래도 Boot의 applicationTaskExecutor를 만들어
      # @Async와 @ApplicationModuleListener가 그것을 쓰게 한다(없으면 실행기 빈 하나를 골라 쓰거나 매번 새 스레드를 만든다).
      mode: force
    scheduling:
      pool:
        # 기본값 1이면 감정 분석 재시도(RetryScheduler, 한 번에 LLM 호출 최대 20건)가 도는 동안
        # 이벤트 재전송(EventPublicationResubmitter)과 로그인 기록 정리가 그 뒤에서 기다린다.
        size: 2
  data:
    redis:
      # 004 실시간 알림의 인스턴스 간 신호(research R5). prod에서 REDIS_URL이 없거나 localhost면 기동하지 않는다
      # (ProdAuthSettingsCheck). 명령이 1초 안에 끝나지 않으면 발행은 WARN만 남기고 넘어간다.
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 1s
      # 붙을 수 없을 때 발행 스레드(RedisSignalPublisher)가 Lettuce 기본값 10초를 기다리지 않게 한다
      connect-timeout: 1s
  modulith:
    events:
      republish-outstanding-events-on-restart: true
    runtime:
      verification-enabled: true # 기동 시에도 모듈 경계 검증 — 위반이 있으면 앱이 뜨지 않는다 (Modulith 2.0+)
  autoconfigure:
    # spring-ai-starter-model-openai(T003)의 spring.ai.openai.* 자동설정을 전부 끈다. api-key가 없으면
    # 기동 자체가 실패하는데(OpenAiSetup이 ClientOptions를 즉시 만든다), 003-core-loop은 ogu.ai.*에서
    # OpenAiApi를 직접 만들어 쓴다(Batch 4). 키가 없어도 앱과 테스트가 뜰 수 있어야 하므로 전부 뺀다.
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

# 감정 분석 호출(ai 모듈 SpringAiEmotionAnalyzer, research R3). 서킷이 열리면 호출 없이 실패하고 emotion 모듈의 재시도 일정에 맡긴다.
resilience4j:
  circuitbreaker:
    instances:
      emotionAnalyzer:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
      # 005: 위험 분류는 감정 분석과 따로 연다. 한쪽 프롬프트의 실패가 다른 쪽을 막지 않게 한다(research R3)
      riskClassifier:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      emotionAnalyzer:
        timeout-duration: ${ogu.ai.timeout}
        cancel-running-future: true
      riskClassifier:
        timeout-duration: ${ogu.ai.timeout}
        cancel-running-future: true

management:
  endpoint:
    health:
      group:
        # Redis 지표는 이 그룹(/actuator/health/realtime)으로만 본다. 기본 그룹(/actuator/health, 배포 롤백 기준)에서는
        # RedisHealthGroupConfig가 뺀다. Redis가 내려가도 알림은 DB에 저장되므로 API를 롤백하지 않는다(research R5).
        # 그룹 이름은 지표 이름(redis)과 같을 수 없다(Spring Boot가 이름 충돌로 기동을 막는다).
        realtime:
          include: redis

springdoc:
  swagger-ui:
    path: /swagger-ui.html

ogu:
  auth:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: 15m
    session:
      idle-ttl: 14d
      absolute-ttl: 30d
      rotation-grace: 30s
    bff-key: ${OGU_BFF_KEY:}
    oauth:
      allowed-redirect-uris: ${OAUTH_ALLOWED_REDIRECT_URIS:http://localhost:3000/api/auth/oauth/kakao/callback,http://localhost:3000/api/auth/oauth/google/callback}
      kakao:
        client-id: ${KAKAO_CLIENT_ID}
        client-secret: ${KAKAO_CLIENT_SECRET}
      google:
        client-id: ${GOOGLE_CLIENT_ID}
        client-secret: ${GOOGLE_CLIENT_SECRET}
  ai:
    base-url: ${AI_BASE_URL:https://integrate.api.nvidia.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:qwen/qwen3-next-80b-a3b-instruct}
    temperature: 0.1
    max-tokens: 200
    timeout: 20s
    prompt-version: v1
  emotion:
    retry:
      initial: 30s
      max-interval: 5m
      deadline: 24h
      poll-interval: 10s
      batch-size: 20
  post:
    rate-limit:
      max-per-hour: 10
  events:
    # 끝나지 않은 이벤트 발행(리스너 실패)을 재기동 없이 다시 보낸다(EventPublicationResubmitter)
    resubmit:
      enabled: true
      interval: 1m
      older-than: 2m
      max-attempts: 10 # 처음 처리를 포함한 시도 횟수. 넘으면 WARN 한 번 남기고 건너뛴다
  # 005 위험 감지와 안전장치(research R3, R4, R9, R13, R14)
  safety:
    term-refresh-interval: 30s
    retry:
      initial: 30s
      max-interval: 5m
      deadline: 24h
      poll-interval: 10s
      batch-size: 20
    report:
      max-per-hour: 20
    retention: 365d
    purge-cron: "0 30 4 * * *" # 매일 04:30 한국 시간
    purge-batch-size: 1000
    backfill:
      enabled: true
      batch-size: 1000
  # 004 실시간 알림(research R2~R5, R10)
  notification:
    heartbeat: 25s
    connection-lifetime: 15m
    max-connections-per-member: 5
    retention: 90d
    safety-drain-interval: 60s
    outage-drain-interval: 5s
    purge-cron: "0 0 4 * * *" # Asia/Seoul 기준 매일 새벽 4시
    purge-batch-size: 1000
    writer-threads: 4
  stream-ticket:
    ttl: 30s
  sse:
    # 스트림에 바로 붙는 브라우저의 출처(콤마 구분). prod에서 비면 기동하지 않는다(ProdAuthSettingsCheck)
    allowed-origins: ${OGU_SSE_ALLOWED_ORIGINS:}
