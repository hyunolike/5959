server:
  # X-Forwarded-For 등으로 request.remoteAddr가 바뀌지 않게 한다. 클라이언트 IP는 BffClientIpResolver가 BFF 키를 확인한
  # X-Ogu-Client-Ip로만 정한다.
  forward-headers-strategy: none

spring:
  application:
    name: ogu-api
  profiles:
    default: local # SPRING_PROFILES_ACTIVE 미지정 시(로컬 실행, 테스트) local을 기본으로 쓴다
  jpa:
    hibernate:
      ddl-auto: validate # 스키마는 Flyway만 바꾼다
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  modulith:
    events:
      republish-outstanding-events-on-restart: true
    runtime:
      verification-enabled: true # 기동 시에도 모듈 경계 검증 — 위반이 있으면 앱이 뜨지 않는다 (Modulith 2.0+)

springdoc:
  swagger-ui:
    path: /swagger-ui.html

ogu:
  auth:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: 15m
    session:
      idle-ttl: 14d
      absolute-ttl: 30d
      rotation-grace: 30s
    bff-key: ${OGU_BFF_KEY:}
    oauth:
      allowed-redirect-uris: ${OAUTH_ALLOWED_REDIRECT_URIS:http://localhost:3000/api/auth/oauth/kakao/callback,http://localhost:3000/api/auth/oauth/google/callback}
      kakao:
        client-id: ${KAKAO_CLIENT_ID}
        client-secret: ${KAKAO_CLIENT_SECRET}
      google:
        client-id: ${GOOGLE_CLIENT_ID}
        client-secret: ${GOOGLE_CLIENT_SECRET}
