server:
  # X-Forwarded-For 등으로 request.remoteAddr가 바뀌지 않게 한다. 클라이언트 IP는 BffClientIpResolver가 BFF 키를 확인한
  # X-Ogu-Client-Ip로만 정한다.
  forward-headers-strategy: none

spring:
  application:
    name: ogu-api
  profiles:
    default: local # SPRING_PROFILES_ACTIVE 미지정 시(로컬 실행, 테스트) local을 기본으로 쓴다
  jpa:
    hibernate:
      ddl-auto: validate # 스키마는 Flyway만 바꾼다
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  modulith:
    events:
      republish-outstanding-events-on-restart: true
    runtime:
      verification-enabled: true # 기동 시에도 모듈 경계 검증 — 위반이 있으면 앱이 뜨지 않는다 (Modulith 2.0+)
  autoconfigure:
    # spring-ai-starter-model-openai(T003)의 spring.ai.openai.* 자동설정을 전부 끈다. api-key가 없으면
    # 기동 자체가 실패하는데(OpenAiSetup이 ClientOptions를 즉시 만든다), 003-core-loop은 ogu.ai.*에서
    # OpenAiApi를 직접 만들어 쓴다(Batch 4). 키가 없어도 앱과 테스트가 뜰 수 있어야 하므로 전부 뺀다.
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

# 감정 분석 호출(ai 모듈 SpringAiEmotionAnalyzer, research R3). 서킷이 열리면 호출 없이 실패하고 emotion 모듈의 재시도 일정에 맡긴다.
resilience4j:
  circuitbreaker:
    instances:
      emotionAnalyzer:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      emotionAnalyzer:
        timeout-duration: ${ogu.ai.timeout}
        cancel-running-future: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

ogu:
  auth:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: 15m
    session:
      idle-ttl: 14d
      absolute-ttl: 30d
      rotation-grace: 30s
    bff-key: ${OGU_BFF_KEY:}
    oauth:
      allowed-redirect-uris: ${OAUTH_ALLOWED_REDIRECT_URIS:http://localhost:3000/api/auth/oauth/kakao/callback,http://localhost:3000/api/auth/oauth/google/callback}
      kakao:
        client-id: ${KAKAO_CLIENT_ID}
        client-secret: ${KAKAO_CLIENT_SECRET}
      google:
        client-id: ${GOOGLE_CLIENT_ID}
        client-secret: ${GOOGLE_CLIENT_SECRET}
  ai:
    base-url: ${AI_BASE_URL:https://integrate.api.nvidia.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:qwen/qwen3-next-80b-a3b-instruct}
    temperature: 0.1
    max-tokens: 200
    timeout: 20s
    prompt-version: v1
  emotion:
    retry:
      initial: 30s
      max-interval: 5m
      deadline: 24h
      poll-interval: 10s
      batch-size: 20
  post:
    rate-limit:
      max-per-hour: 10
