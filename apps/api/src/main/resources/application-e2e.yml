# infra/compose.e2e.yaml가 SPRING_PROFILES_ACTIVE=e2e로 띄우는 API 컨테이너 설정.
# JWT_SECRET, OGU_BFF_KEY는 application.yml의 공용 플레이스홀더(${JWT_SECRET}, ${OGU_BFF_KEY:})를 그대로 쓰고,
# 값은 compose.e2e.yaml이 고정 값을 env로 넣는다(prod에서 비밀 값을 .env로 넣는 것과 같은 자리, e2e는 값 자체가 커밋된 고정값).
# datasource는 prod와 같은 방식으로 컨테이너 네트워크 안의 Postgres 주소를 env로 받는다(로컬 profile처럼
# spring-boot-docker-compose 자동 감지에 기대지 않는다. 이미지가 이미 compose 네트워크 안에서 뜨기 때문).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

ogu:
  # 015 비밀번호 재설정: e2e는 메일을 보내지 않는 가짜 발송을 쓰고, 링크의 값이 이메일에서 정해진다(E2eResetTokenGenerator)
  mail:
    enabled: true
  auth:
    oauth:
      allowed-redirect-uris: http://localhost:3000/api/auth/oauth/kakao/callback,http://localhost:3000/api/auth/oauth/google/callback
      # e2e는 FakeOAuthProviderClient가 제공자를 대신하므로 실제 키가 필요 없다. 바인딩만 되게 고정 값을 둔다.
      kakao:
        client-id: e2e-unused
        client-secret: e2e-unused
      google:
        client-id: e2e-unused
        client-secret: e2e-unused
  # 008 주간 리포트: 발행 시각을 기다리지 않고 5초마다 지난주 리포트를 채운다. 테스트가 글의 때를 한 주 앞으로 옮긴다
  report:
    publish-at: "00:00"
    poll-interval: 5s
    letter:
      poll-interval: 5s
  # 009 AI 친구: 가짜 댓글 쓰기를 쓰고 5초만 기다렸다 반응한다. 가짜는 본문에 [AI친구]가 있는 글에만 답하고
  # 나머지 글에서는 실패한다(다른 시나리오의 댓글 수와 HP가 흔들리지 않게). 그 실패도 하루의 몫을 쓰므로 넉넉히 둔다
  # 수동 검증(009 quickstart)에서 끄거나 상한과 기다리는 시간을 바꿔 볼 수 있게 운영과 같은 환경 변수를 받는다
  companion:
    enabled: ${AI_COMPANION_ENABLED:true}
    daily-limit: ${AI_COMPANION_DAILY_LIMIT:100000}
    wait: ${AI_COMPANION_WAIT:5s}
    poll-interval: 2s
    risk-wait: 2s
    retry:
      initial-interval: 2s
      max-interval: 4s
    # 012: 반응할 수는 무작위가 아니라 본문의 [AI친구:2], [AI친구:3]으로 정한다(없으면 한 명). 뒤따르는 친구는 몇 초 뒤에 온다
    follow-up:
      min-gap: ${AI_COMPANION_FOLLOW_UP_MIN:2s}
      max-gap: ${AI_COMPANION_FOLLOW_UP_MAX:4s}
    # 012: 글쓰기는 e2e에서도 꺼져 있다. 켜면 다른 시나리오의 피드와 둘러보기 목록이 흔들린다.
    # 손으로 볼 때는 AI_COMPANION_POSTING_ENABLED=true AI_COMPANION_POSTING_QUIET=1m으로 띄운다(012 quickstart)
    posting:
      poll-interval: 5s
