openapi: 3.1.0
info:
  title: 오구오구 API
  version: 0.6.0
  description: |
    apps/api가 이 계약을 구현하고, apps/web은 이 계약에서 타입을 생성한다.
    이 API는 BFF(apps/web의 라우트 핸들러)만 호출한다. 브라우저는 직접 호출하지 않는다.
    모든 응답은 ApiResponse 봉투를 쓴다.
    002-auth에서 추가한 인증과 회원 API는 모두 온보딩 전에도 쓸 수 있다.
    003-core-loop에서 추가한 고민 글, 공감, 댓글, 피드 API는 모두 인증이 필요하고,
    온보딩 전 회원에게는 403 ONBOARDING_REQUIRED를 돌려준다.
    006-raid에서 추가한 레이드 API도 인증이 필요하고 온보딩 전 회원에게는 403을 돌려준다.
    004-notification-mypage에서 추가한 알림과 마이페이지, 프로필 수정 API도 모두 인증이 필요하고,
    온보딩 전 회원에게는 403 ONBOARDING_REQUIRED를 돌려준다. 실시간 알림 스트림
    (GET /api/v1/notifications/stream)만은 예외로, 브라우저가 BFF를 거치지 않고 API 도메인에 바로 붙으며
    Bearer 대신 일회용 티켓으로 인증한다(ADR-0002, 004 research R3).
    005-safety에서 추가한 도움 리소스, 신고, 재검토 요청 API도 인증과 온보딩이 필요하다.
    운영자 경로(/api/v1/operator/**)는 member.role이 OPERATOR인 회원만 쓰고, 아니면 경로가 있다는 것도
    드러나지 않도록 404 NOT_FOUND를 돌려준다(005 research R10). 글과 댓글의 본문과 미리보기는
    보는 사람이 작성자가 아니면 욕설이 가려진 채로 나간다(005 research R6).
servers:
  - url: http://localhost:8080
security:
  - bearer: []
tags:
  - name: auth
    description: 가입, 로그인, 외부 계정 로그인, 세션 갱신, 로그아웃
  - name: member
    description: 내 프로필, 닉네임 확인, 온보딩, 프로필 수정
  - name: post
    description: 고민 글 작성, 수정, 삭제
  - name: reaction
    description: 공감, 댓글, 댓글 공감
  - name: feed
    description: 피드와 글 상세 조회
  - name: notification
    description: 알림 목록, 읽음, 안 읽은 수, 실시간 스트림
  - name: mypage
    description: 내가 쓴 글, 내 댓글, 공감한 글, 감정 통계
  - name: safety
    description: 도움 리소스, 신고, 재검토 요청
  - name: operator
    description: 운영자 조회와 처리
  - name: raid
    description: 보스 레이드

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BffKey:
      name: X-Ogu-Bff-Key
      in: header
      required: false
      description: BFF와 API가 공유하는 비밀 키. 맞을 때만 X-Ogu-Client-Ip를 믿는다.
      schema: { type: string }
    ClientIp:
      name: X-Ogu-Client-Ip
      in: header
      required: false
      description: 브라우저의 원래 IP. 로그인 실패 제한에 쓴다.
      schema: { type: string }
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [kakao, google]
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    CommentId:
      name: commentId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Cursor:
      name: cursor
      in: query
      description: 앞 쪽 응답의 nextCursor. 불투명 문자열이다
      schema: { type: string }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    TargetType:
      name: targetType
      in: path
      required: true
      schema: { $ref: '#/components/schemas/TargetType' }
    TargetId:
      name: targetId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: ErrorCode 이름
          examples: [INVALID_CREDENTIALS]
        message:
          type: string
        retryAfterSeconds:
          type: integer
          description: LOGIN_THROTTLED일 때만 있다
    ErrorEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: false }
        data: { type: 'null' }
        error: { $ref: '#/components/schemas/ErrorResponse' }
    JobRole:
      type: string
      enum: [PLANNING, DESIGN, DEVELOPMENT, MARKETING, SALES, HR, GENERAL_AFFAIRS, PRODUCTION, ACCOUNTING, OTHER]
    CareerYear:
      type: string
      enum: [NEWCOMER, YEAR_1, YEAR_2, YEAR_3, YEAR_4, YEAR_5, YEAR_6, YEAR_7_PLUS]
    AuthMethod:
      type: string
      enum: [EMAIL, KAKAO, GOOGLE]
    MemberProfile:
      type: object
      required: [id, authMethod, onboarded]
      properties:
        id: { type: integer, format: int64 }
        authMethod: { $ref: '#/components/schemas/AuthMethod' }
        email: { type: [string, 'null'] }
        nickname: { type: [string, 'null'] }
        jobRole:
          oneOf: [{ $ref: '#/components/schemas/JobRole' }, { type: 'null' }]
        careerYear:
          oneOf: [{ $ref: '#/components/schemas/CareerYear' }, { type: 'null' }]
        onboarded: { type: boolean }
    AuthTokens:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken:
          type: [string, 'null']
          description: refresh 유예 구간(교체 후 30초)에서는 null이다. 이때 BFF는 refresh 쿠키를 바꾸지 않는다.
        refreshTokenExpiresAt: { type: string, format: date-time }
    AuthResult:
      type: object
      required: [member, tokens, newMember]
      properties:
        member: { $ref: '#/components/schemas/MemberProfile' }
        tokens: { $ref: '#/components/schemas/AuthTokens' }
        newMember:
          type: boolean
          description: 이번 요청으로 회원이 만들어졌으면 true
    AuthResultEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/AuthResult' }
        error: { type: 'null' }
    MemberProfileEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/MemberProfile' }
        error: { type: 'null' }
    OnboardingResult:
      type: object
      required: [member, accessToken, accessTokenExpiresAt]
      properties:
        member: { $ref: '#/components/schemas/MemberProfile' }
        accessToken:
          type: string
          description: onboarded=true 클레임을 담은 새 access 토큰
        accessTokenExpiresAt: { type: string, format: date-time }
    NicknameAvailability:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        reason:
          type: [string, 'null']
          enum: [INVALID_FORMAT, TAKEN, null]
    EmailPasswordRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 20 }
    CommentTone:
      type: string
      enum: [VENT_WITH_ME, COMFORT_ME, WARM_ADVICE, MAKE_ME_LAUGH]
    EmotionType:
      type: string
      enum: [ANXIETY, LETHARGY, LONELINESS, SELF_DEPRECATION, IRRITATION]
    AnalysisStatus:
      type: string
      enum: [PENDING, ANALYZED, DEFAULTED]
    MonsterView:
      type: object
      required: [emotion, hp, maxHp, status]
      properties:
        emotion: { $ref: '#/components/schemas/EmotionType' }
        hp: { type: integer, minimum: 0 }
        maxHp: { type: integer, enum: [10, 20, 30] }
        status: { type: string, enum: [ALIVE, DEFEATED] }
    Author:
      type: object
      required: [id, nickname, jobRole, careerYear]
      properties:
        id: { type: integer, format: int64 }
        nickname: { type: string }
        jobRole: { $ref: '#/components/schemas/JobRole' }
        careerYear: { $ref: '#/components/schemas/CareerYear' }
    PostWriteRequest:
      type: object
      required: [content, commentTone]
      properties:
        content:
          type: string
          description: 앞뒤 공백을 뺀 글자(grapheme) 1~500자
        commentTone: { $ref: '#/components/schemas/CommentTone' }
    PostUpdateRequest:
      type: object
      minProperties: 1
      properties:
        content: { type: string }
        commentTone: { $ref: '#/components/schemas/CommentTone' }
    PostCreated:
      type: object
      required: [postId, analysisStatus]
      properties:
        postId: { type: integer, format: int64 }
        analysisStatus: { $ref: '#/components/schemas/AnalysisStatus' }
    FeedItem:
      type: object
      required: [postId, author, contentPreview, analysisStatus, likeCount, likedByMe, commentCount, hidden, createdAt]
      properties:
        postId: { type: integer, format: int64 }
        author: { $ref: '#/components/schemas/Author' }
        contentPreview:
          type: string
          description: 앞 50글자. 더 길면 끝에 "..."
        analysisStatus: { $ref: '#/components/schemas/AnalysisStatus' }
        monster:
          oneOf: [{ $ref: '#/components/schemas/MonsterView' }, { type: 'null' }]
          description: 분석 중이면 null
        likeCount: { type: integer }
        likedByMe: { type: boolean }
        commentCount: { type: integer }
        hidden:
          type: boolean
          description: 다른 회원에게 보이지 않는 내 글이면 true. 내가 쓴 글 목록에서만 true일 수 있다(005)
        createdAt: { type: string, format: date-time }
    FeedPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FeedItem' }
        nextCursor:
          type: [string, 'null']
          description: 다음 페이지가 없으면 null. 불투명 문자열
    PostDetail:
      type: object
      required: [postId, author, content, commentTone, analysisStatus, likeCount, likedByMe, commentCount, mine, createdAt]
      properties:
        postId: { type: integer, format: int64 }
        author: { $ref: '#/components/schemas/Author' }
        content: { type: string }
        commentTone: { $ref: '#/components/schemas/CommentTone' }
        analysisStatus: { $ref: '#/components/schemas/AnalysisStatus' }
        monster:
          oneOf: [{ $ref: '#/components/schemas/MonsterView' }, { type: 'null' }]
        likeCount: { type: integer }
        likedByMe: { type: boolean }
        commentCount: { type: integer }
        mine: { type: boolean, description: 내가 쓴 글이면 true }
        myCommentCounted:
          type: boolean
          description: 내 댓글이 이미 HP에 반영됐으면 true. 웹의 낙관적 HP 계산(research R6)에 쓴다
        safety:
          description: 내가 쓴 글일 때만 실린다. 다른 회원의 응답에는 없다(005 research R7)
          $ref: '#/components/schemas/ContentSafety'
        createdAt: { type: string, format: date-time }
    Comment:
      type: object
      required: [commentId, author, content, hidden, likeCount, likedByMe, mine, createdAt, replies]
      properties:
        commentId: { type: integer, format: int64 }
        author:
          oneOf: [{ $ref: '#/components/schemas/Author' }, { type: 'null' }]
          description: 숨긴 댓글을 다른 회원이 보면 null
        content:
          type: [string, 'null']
          description: 숨긴 댓글을 다른 회원이 보면 null. 웹은 "가려진 댓글이에요"를 보인다
        hidden: { type: boolean, description: 다른 회원에게 보이지 않는 댓글이면 true }
        safety:
          description: 내가 쓴 댓글일 때만 실린다
          $ref: '#/components/schemas/ContentSafety'
        likeCount: { type: integer }
        likedByMe: { type: boolean }
        mine: { type: boolean }
        createdAt: { type: string, format: date-time }
        replies:
          type: array
          description: 답글(오래된 순). 답글의 replies는 항상 빈 배열이다
          items: { $ref: '#/components/schemas/Comment' }
    CommentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: 원 댓글(오래된 순)과 각 답글
          items: { $ref: '#/components/schemas/Comment' }
        nextCursor: { type: [string, 'null'] }
    CommentWriteRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: 앞뒤 공백을 뺀 글자 1~300자
        parentId:
          type: [integer, 'null']
          format: int64
          description: 답글이면 원 댓글 ID
    LikeResult:
      type: object
      required: [likeCount, likedByMe]
      properties:
        likeCount: { type: integer }
        likedByMe: { type: boolean }
    NotificationType:
      type: string
      description: |
        POST_COMMENT 내 글의 댓글, POST_REPLY 내 글의 답글, COMMENT_REPLY 내 댓글의 답글,
        POST_LIKE 내 글 공감(묶음), MONSTER_SPAWNED 몬스터 생성, MONSTER_DEFEATED 내 몬스터 처치,
        MONSTER_DEFEATED_TOGETHER 함께 공격한 몬스터 처치,
        SUPPORT_NOTICE 도움 안내(005), CONTENT_RESTORED 가려졌던 글이 다시 보임(005), REVIEW_KEPT 재검토 결과 숨김 유지(005),
        RAID_BOSS_DEFEATED 내가 공격한 보스 처치(006). 글이 없고 누르면 레이드 화면으로 간다
      enum:
        - POST_COMMENT
        - POST_REPLY
        - COMMENT_REPLY
        - POST_LIKE
        - MONSTER_SPAWNED
        - MONSTER_DEFEATED
        - MONSTER_DEFEATED_TOGETHER
        - SUPPORT_NOTICE
        - CONTENT_RESTORED
        - REVIEW_KEPT
        - RAID_BOSS_DEFEATED
    NotificationActor:
      type: object
      required: [id, nickname]
      properties:
        id: { type: integer, format: int64 }
        nickname: { type: string, description: 지금 닉네임 }
    NotificationPost:
      type: object
      required: [postId, contentPreview]
      properties:
        postId: { type: integer, format: int64 }
        contentPreview: { type: string, description: 앞 50글자 }
    Notification:
      type: object
      required: [notificationId, seq, type, postId, post, actor, actorCount, read, createdAt, updatedAt]
      properties:
        notificationId: { type: integer, format: int64 }
        seq:
          type: integer
          format: int64
          description: 회원별 전달 순서 번호. SSE 이벤트 id와 같고, 모두 읽음의 upToSeq로 쓴다
        type: { $ref: '#/components/schemas/NotificationType' }
        postId: { type: [integer, 'null'], format: int64, description: RAID_BOSS_DEFEATED는 글이 없어 null }
        post:
          oneOf: [{ $ref: '#/components/schemas/NotificationPost' }, { type: 'null' }]
          description: 글이 지워졌으면 null. 화면은 "삭제된 글"로 보인다(US2-AC5). RAID_BOSS_DEFEATED도 null이다
        commentId:
          type: [integer, 'null']
          format: int64
          description: 댓글과 답글 알림일 때만 있다
        actor:
          oneOf: [{ $ref: '#/components/schemas/NotificationActor' }, { type: 'null' }]
          description: 가장 최근 행동한 회원. 몬스터 알림은 null
        actorCount:
          type: integer
          minimum: 1
          description: 공감 묶음의 인원 수. 다른 종류는 1
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: 마지막 갱신 시각. 공감 묶음은 마지막 공감 시각이다
    NotificationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: seq 내림차순(최신순). 묶인 공감은 마지막 공감 기준으로 위에 온다
          items: { $ref: '#/components/schemas/Notification' }
        nextCursor: { type: [string, 'null'] }
    UnreadCount:
      type: object
      required: [count, latestSeq]
      properties:
        count:
          type: integer
          minimum: 0
          description: 안 읽은 알림 수. 99를 넘으면 화면이 "99+"로 보인다
        latestSeq:
          type: integer
          format: int64
          minimum: 0
          description: 이 회원의 마지막 전달 번호. 알림이 없으면 0
    ReadAllRequest:
      type: object
      required: [upToSeq]
      properties:
        upToSeq:
          type: integer
          format: int64
          minimum: 0
          description: 이 번호 이하의 안 읽은 알림만 읽음으로 바꾼다(US2-AC4)
    ReadAllResult:
      type: object
      required: [updated, unreadCount]
      properties:
        updated: { type: integer, description: 이번에 읽음이 된 알림 수 }
        unreadCount: { type: integer, description: 처리 뒤 남은 안 읽은 수 }
    StreamTicket:
      type: object
      required: [ticket, expiresAt]
      properties:
        ticket:
          type: string
          description: 32바이트 난수의 base64url. 30초 안에 한 번만 쓸 수 있다
        expiresAt: { type: string, format: date-time }
    StreamNotificationEvent:
      type: object
      description: |
        SSE `event: notification`의 data. SSE `id`는 notification.seq다.
        웹은 notificationId로 덮어쓰고 그 항목을 맨 위로 올린다(묶음 갱신 포함).
      required: [notification, unreadCount]
      properties:
        notification: { $ref: '#/components/schemas/Notification' }
        unreadCount: { type: integer, minimum: 0 }
    StreamUnreadCountEvent:
      type: object
      description: "SSE `event: unread-count`의 data. id가 없고 재전송하지 않는다"
      required: [unreadCount]
      properties:
        unreadCount: { type: integer, minimum: 0 }
    StreamPingEvent:
      type: object
      description: "SSE `event: ping`의 data. 내용이 없는 빈 객체다. id가 없고 재전송하지 않는다"
      additionalProperties: false
    MyComment:
      type: object
      required: [commentId, postId, postContentPreview, content, reply, createdAt]
      properties:
        commentId: { type: integer, format: int64 }
        postId: { type: integer, format: int64 }
        postContentPreview: { type: string, description: 댓글이 달린 글의 앞 50글자 }
        content: { type: string }
        reply: { type: boolean, description: 답글이면 true }
        createdAt: { type: string, format: date-time }
    MyCommentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MyComment' }
        nextCursor: { type: [string, 'null'] }
    EmotionShare:
      type: object
      required: [emotion, count, percent]
      properties:
        emotion: { $ref: '#/components/schemas/EmotionType' }
        count: { type: integer, minimum: 0 }
        percent:
          type: integer
          minimum: 0
          maximum: 100
          description: 정수 퍼센트. 다섯 항목의 합은 100이고 몬스터가 없으면 모두 0이다(US4-AC1)
    WeeklyEmotionCount:
      type: object
      required: [weekStart, counts]
      properties:
        weekStart:
          type: string
          format: date
          description: 한국 시간 월요일 날짜
        counts:
          type: array
          description: 감정 5종을 EmotionType 순서대로 모두 담는다. 글이 없던 주는 모두 0
          minItems: 5
          maxItems: 5
          items:
            type: object
            required: [emotion, count]
            properties:
              emotion: { $ref: '#/components/schemas/EmotionType' }
              count: { type: integer, minimum: 0 }
    EmotionStats:
      type: object
      required: [totalMonsters, defeatedMonsters, defeatedTogether, raidBossesDefeated, distribution, topEmotion, weekly]
      properties:
        totalMonsters: { type: integer, minimum: 0, description: 지우지 않은 내 글의 몬스터 수 }
        defeatedMonsters: { type: integer, minimum: 0 }
        defeatedTogether:
          type: integer
          minimum: 0
          description: 내가 HP를 줄인 다른 사람의 몬스터 가운데 처치된 수(US4-AC5)
        raidBossesDefeated:
          type: integer
          minimum: 0
          description: 내가 공격에 참여한 레이드 보스 가운데 처치된 수(006 US4-AC5)
        distribution:
          type: array
          minItems: 5
          maxItems: 5
          items: { $ref: '#/components/schemas/EmotionShare' }
        topEmotion:
          oneOf: [{ $ref: '#/components/schemas/EmotionType' }, { type: 'null' }]
          description: 가장 많이 나타난 감정. 같으면 가장 최근 몬스터의 감정. 몬스터가 없으면 null
        weekly:
          type: array
          description: 최근 8주(이번 주 포함), 오래된 주부터
          minItems: 8
          maxItems: 8
          items: { $ref: '#/components/schemas/WeeklyEmotionCount' }
    ProfileUpdateRequest:
      type: object
      minProperties: 1
      description: 보낸 항목만 바꾼다
      properties:
        nickname:
          type: string
          description: M1과 같은 규칙. 앞뒤 공백을 뺀 완성형 한글, 영문, 숫자 1~10자. 대소문자만 다른 닉네임도 중복이다
        jobRole: { $ref: '#/components/schemas/JobRole' }
        careerYear: { $ref: '#/components/schemas/CareerYear' }
    TargetType:
      type: string
      enum: [POST, COMMENT]
    RiskLevel:
      type: string
      description: NONE 위험 없음, CONCERN 우려(숨기지 않고 안내만), CRISIS 위기(숨기고 안내)
      enum: [NONE, CONCERN, CRISIS]
    ContentSafety:
      type: object
      description: 작성자에게만 실린다. 다른 회원의 응답에는 없다
      required: [level, hidden, reviewRequested]
      properties:
        level: { $ref: '#/components/schemas/RiskLevel' }
        hidden: { type: boolean, description: 다른 회원에게 보이지 않으면 true }
        reviewRequested: { type: boolean, description: 재검토를 이미 요청했으면 true }
    SupportResource:
      type: object
      required: [name, phone, hours, description]
      properties:
        name: { type: string, examples: [자살예방상담전화] }
        phone: { type: string, examples: ['109'] }
        hours: { type: string, examples: [24시간] }
        description: { type: string }
    ReportReason:
      type: string
      description: DANGEROUS 위험해 보여요, ABUSIVE 욕설이나 비방, SPAM 광고나 도배, OTHER 기타
      enum: [DANGEROUS, ABUSIVE, SPAM, OTHER]
    ReportRequest:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType: { $ref: '#/components/schemas/TargetType' }
        targetId: { type: integer, format: int64 }
        reason: { $ref: '#/components/schemas/ReportReason' }
        detail:
          type: [string, 'null']
          description: reason이 OTHER일 때만 받는다. 200글자(사람이 보는 글자 단위)까지
    ReviewRequestBody:
      type: object
      required: [targetType, targetId]
      properties:
        targetType: { $ref: '#/components/schemas/TargetType' }
        targetId: { type: integer, format: int64 }
    AssessmentStatus:
      type: string
      description: PENDING AI 대기, DONE AI 반영, FALLBACK AI 포기(키워드만), SUPERSEDED 고쳐져 새 판정이 생김
      enum: [PENDING, DONE, FALLBACK, SUPERSEDED]
    DetectionMethod:
      type: string
      enum: [KEYWORD, AI, BOTH, NONE]
    OperatorTarget:
      type: object
      description: 운영자가 판단하려고 보는 대상. 본문은 가리지 않은 원문이다
      required: [targetType, targetId, postId, authorId, content, hidden, deleted]
      properties:
        targetType: { $ref: '#/components/schemas/TargetType' }
        targetId: { type: integer, format: int64 }
        postId: { type: integer, format: int64 }
        authorId: { type: [integer, 'null'], format: int64, description: 지워진 대상의 신고에서는 null }
        content: { type: [string, 'null'], description: 지워졌으면 null }
        hidden: { type: boolean }
        deleted: { type: boolean }
    OperatorAssessment:
      type: object
      required: [assessmentId, target, level, method, status, reviewed, createdAt]
      properties:
        assessmentId: { type: integer, format: int64 }
        target: { $ref: '#/components/schemas/OperatorTarget' }
        level: { $ref: '#/components/schemas/RiskLevel' }
        method: { $ref: '#/components/schemas/DetectionMethod' }
        status: { $ref: '#/components/schemas/AssessmentStatus' }
        reviewed: { type: boolean }
        createdAt: { type: string, format: date-time }
    OperatorAssessmentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OperatorAssessment' }
        nextCursor: { type: [string, 'null'] }
    ReportStatus:
      type: string
      description: PENDING 대기, RESOLVED 처리됨, REJECTED 기각, CLOSED 대상이 지워짐
      enum: [PENDING, RESOLVED, REJECTED, CLOSED]
    OperatorReport:
      type: object
      required: [reportId, target, reporterId, reason, detail, openReportCount, status, createdAt]
      properties:
        reportId: { type: integer, format: int64 }
        target: { $ref: '#/components/schemas/OperatorTarget' }
        reporterId: { type: integer, format: int64 }
        reason: { $ref: '#/components/schemas/ReportReason' }
        detail: { type: [string, 'null'] }
        openReportCount: { type: integer, description: 같은 대상의 열린 신고 수 }
        status: { $ref: '#/components/schemas/ReportStatus' }
        createdAt: { type: string, format: date-time }
    OperatorReportPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OperatorReport' }
        nextCursor: { type: [string, 'null'] }
    ReviewStatus:
      type: string
      description: PENDING 대기, KEPT 숨김 유지, RESTORED 숨김 해제
      enum: [PENDING, KEPT, RESTORED]
    OperatorReview:
      type: object
      required: [reviewId, target, status, createdAt]
      properties:
        reviewId: { type: integer, format: int64 }
        target: { $ref: '#/components/schemas/OperatorTarget' }
        status: { $ref: '#/components/schemas/ReviewStatus' }
        createdAt: { type: string, format: date-time }
    OperatorReviewPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OperatorReview' }
        nextCursor: { type: [string, 'null'] }
    OperatorNote:
      type: object
      properties:
        note:
          type: [string, 'null']
          description: 처리 기록에 남길 메모. 200자까지. 본문을 옮겨 적지 않는다
    ReportDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          description: RESOLVE는 처리됨으로, REJECT는 기각으로 닫는다. 대상을 숨기려면 hideContent를 따로 부른다
          enum: [RESOLVE, REJECT]
        note: { type: [string, 'null'] }
    ReviewDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          description: KEEP은 숨김 유지, RESTORE는 숨김 해제
          enum: [KEEP, RESTORE]
        note: { type: [string, 'null'] }
    TermKind:
      type: string
      description: CRISIS 위기 표현, CONCERN 우려 표현, PROFANITY 욕설, ALLOW 욕설이 들어 있어도 가리지 않을 낱말
      enum: [CRISIS, CONCERN, PROFANITY, ALLOW]
    Term:
      type: object
      required: [termId, kind, term]
      properties:
        termId: { type: integer, format: int64 }
        kind: { $ref: '#/components/schemas/TermKind' }
        term: { type: string, description: 정규화한 형태 }
    TermRequest:
      type: object
      required: [kind, term]
      properties:
        kind: { $ref: '#/components/schemas/TermKind' }
        term: { type: string, description: 2~20글자. 저장할 때 정규화한다 }
    RaidBossStatus:
      type: string
      description: ALIVE 살아 있음, DEFEATED 처치됨, RETREATED 7일 동안 처치되지 않아 물러남
      enum: [ALIVE, DEFEATED, RETREATED]
    RaidBoss:
      type: object
      required: [bossId, emotion, maxHp, hp, status, participantCount, spawnedAt, endedAt]
      properties:
        bossId: { type: integer, format: int64 }
        emotion: { $ref: '#/components/schemas/EmotionType' }
        maxHp: { type: integer }
        hp: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/RaidBossStatus' }
        participantCount: { type: integer, description: 한 번이라도 공격한 회원 수 }
        spawnedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
    RaidState:
      type: object
      description: |
        레이드 화면이 그리는 전부. boss는 살아 있는 보스이거나, 없으면 가장 최근에 끝난 보스다.
        보스가 한 번도 없었으면 null이다.
      required: [boss, myDamage, nextBossAt, available, epoch]
      properties:
        boss:
          oneOf:
            - $ref: '#/components/schemas/RaidBoss'
            - type: 'null'
        myDamage: { type: integer, description: 이 보스에게 내가 준 피해. 공격한 적 없으면 0 }
        nextBossAt:
          type: [string, 'null']
          format: date-time
          description: 살아 있는 보스가 없을 때 다음 보스가 나오는 때. 살아 있으면 null
        available:
          type: boolean
          description: false면 지금 공격을 받을 수 없다. 값은 마지막으로 기록된 것이다(research R4)
        epoch:
          type: integer
          description: 값이 기록에서 다시 채워질 때마다 오른다. 커지면 화면의 HP를 받은 값으로 바꾼다(research R8)
    RaidLive:
      type: object
      description: 실시간 `raid` 이벤트의 data. 모든 연결에 같은 내용이 가므로 내 기여는 없다
      required: [bossId, hp, maxHp, status, participantCount, available, epoch]
      properties:
        bossId: { type: [integer, 'null'], format: int64 }
        hp: { type: integer }
        maxHp: { type: integer }
        status: { $ref: '#/components/schemas/RaidBossStatus' }
        participantCount: { type: integer }
        available: { type: boolean }
        epoch: { type: integer }
    RaidAttackRequest:
      type: object
      required: [bossId]
      properties:
        bossId:
          type: integer
          format: int64
          description: 화면이 보고 있는 보스. 그 사이 보스가 바뀌었으면 409다
    RaidAttackResult:
      type: object
      required: [bossId, hp, maxHp, status, participantCount, myDamage, defeated, cooldownMs]
      properties:
        bossId: { type: integer, format: int64 }
        hp: { type: integer, minimum: 0 }
        maxHp: { type: integer }
        status: { $ref: '#/components/schemas/RaidBossStatus' }
        participantCount: { type: integer }
        myDamage: { type: integer }
        defeated: { type: boolean, description: 이 공격으로 처치됐다 }
        cooldownMs: { type: integer, description: 다음 공격까지 기다릴 시간 }
  responses:
    BadRequest:
      description: 입력 검증 실패 (INVALID_REQUEST). 댓글 작성에서는 INVALID_PARENT_COMMENT도 쓴다
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: 인증 없음 또는 세션 만료, 무효 (UNAUTHORIZED, SESSION_EXPIRED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: 온보딩 전(ONBOARDING_REQUIRED) 또는 권한 없음(NOT_AUTHOR, CANNOT_LIKE_OWN_POST)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: 없거나, 삭제됐거나, 숨겨진 글 또는 댓글 (POST_NOT_FOUND, COMMENT_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

    OperatorOnly:
      description: 운영자가 아니거나 대상이 없음 (NOT_FOUND). 운영자가 아닌 회원에게 경로의 존재를 드러내지 않는다
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
paths:
  /api/v1/auth/signup:
    post:
      tags: [auth]
      operationId: signup
      security: []
      summary: 이메일 가입 (US1-AC1~AC3)
      parameters:
        - $ref: '#/components/parameters/BffKey'
        - $ref: '#/components/parameters/ClientIp'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailPasswordRequest' }
      responses:
        '201':
          description: 가입과 동시에 로그인된다. member.onboarded는 false다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResultEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: 이미 가입된 이메일(EMAIL_ALREADY_REGISTERED), 또는 외부 계정 회원이 쓰는 이메일(EMAIL_REGISTERED_WITH_OTHER_METHOD)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      summary: 이메일 로그인 (US2-AC1~AC4)
      parameters:
        - $ref: '#/components/parameters/BffKey'
        - $ref: '#/components/parameters/ClientIp'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailPasswordRequest' }
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResultEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: 이메일 또는 비밀번호가 틀림. 어느 쪽인지 구분하지 않는다 (INVALID_CREDENTIALS)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: 로그인 실패 제한에 걸림 (LOGIN_THROTTLED). error.retryAfterSeconds와 Retry-After 헤더가 있다
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/auth/oauth/{provider}:
    post:
      tags: [auth]
      operationId: oauthLogin
      security: []
      summary: 외부 계정 인가 코드 교환과 로그인 (US3-AC1~AC3)
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/BffKey'
        - $ref: '#/components/parameters/ClientIp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, redirectUri]
              properties:
                code: { type: string }
                redirectUri:
                  type: string
                  format: uri
                  description: 인가 요청에 쓴 redirect_uri와 같아야 한다. API는 허용 목록과 대조한다
                codeVerifier:
                  type: [string, 'null']
                  description: PKCE를 쓴 경우에만 보낸다
      responses:
        '200':
          description: 로그인 성공. 처음이면 newMember=true, member.onboarded=false
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResultEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: 제공자가 코드를 거절함 (OAUTH_CODE_INVALID)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: 같은 이메일이 이메일 가입으로 이미 쓰임 (EMAIL_REGISTERED_WITH_OTHER_METHOD)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502':
          description: 제공자가 응답하지 않음 (OAUTH_PROVIDER_UNAVAILABLE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      security: []
      summary: 세션 갱신 (US4-AC1~AC3)
      parameters:
        - $ref: '#/components/parameters/BffKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 새 토큰. 유예 구간에서는 tokens.refreshToken이 null
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResultEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 현재 세션 무효화 (US2-AC5)
      security: [{ bearer: [] }]
      responses:
        '204':
          description: 세션이 무효가 되었다. 이미 무효이거나 만료된 세션의 토큰은 401이다(BFF는 결과와 관계없이 쿠키를 지운다)
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/members/me:
    get:
      tags: [member]
      operationId: getMe
      summary: 내 프로필 (FR-015). 온보딩 전에도 호출할 수 있다
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 내 프로필
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberProfileEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [member]
      operationId: updateMyProfile
      summary: 프로필 수정 (US5-AC1~AC4). 온보딩을 마친 회원만
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdateRequest' }
      responses:
        '200':
          description: 저장됨
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/MemberProfile' }
                  error: { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 닉네임 중복, 대소문자만 다른 경우 포함 (NICKNAME_TAKEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/members/nickname-availability:
    get:
      tags: [member]
      operationId: checkNickname
      summary: 닉네임 사용 가능 여부 (US1-AC5, US1-AC6)
      security: [{ bearer: [] }]
      parameters:
        - name: nickname
          in: query
          required: true
          schema: { type: string, maxLength: 50 }
      responses:
        '200':
          description: 사용 가능 여부
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/NicknameAvailability' }
                  error: { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/members/me/onboarding:
    put:
      tags: [member]
      operationId: completeOnboarding
      summary: 온보딩 완료 (US1-AC4~AC6)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname, jobRole, careerYear]
              properties:
                nickname: { type: string }
                jobRole: { $ref: '#/components/schemas/JobRole' }
                careerYear: { $ref: '#/components/schemas/CareerYear' }
      responses:
        '200':
          description: 온보딩 완료. 새 access 토큰을 함께 준다
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/OnboardingResult' }
                  error: { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 닉네임 중복(NICKNAME_TAKEN) 또는 이미 온보딩함(ALREADY_ONBOARDED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/posts:
    post:
      tags: [post]
      operationId: createPost
      summary: 고민 글 작성 (US1-AC1, AC2). 감정 분석은 비동기
      requestBody:
        required: true
        content:
