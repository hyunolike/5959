                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SupportResource' }
                  error: { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/reports:
    post:
      tags: [safety]
      operationId: reportContent
      summary: 글이나 댓글 신고 (US3-AC1~AC5)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportRequest' }
      responses:
        '204':
          description: 접수됨. 신고 수나 처리 상태는 돌려주지 않는다
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 온보딩 전(ONBOARDING_REQUIRED) 또는 자기 글이나 댓글(CANNOT_REPORT_OWN_CONTENT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 신고한 대상 (ALREADY_REPORTED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: 한 시간 20건 초과 (REPORT_RATE_LIMITED). Retry-After 헤더에 남은 초
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/review-requests:
    post:
      tags: [safety]
      operationId: requestReview
      summary: 숨겨진 내 글이나 댓글의 재검토 요청 (US4-AC8). 대상마다 한 번
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequestBody' }
      responses:
        '204':
          description: 접수됨
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: 내 것이 아니거나, 숨겨지지 않았거나, 없는 대상 (POST_NOT_FOUND, COMMENT_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: 이미 요청함 (REVIEW_ALREADY_REQUESTED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/operator/assessments:
    get:
      tags: [operator]
      operationId: listAssessments
      summary: 위험 판정 조회 (US4-AC1). 최신순. 기본은 단계가 NONE이 아닌 것
      parameters:
        - name: level
          in: query
          required: false
          schema: { $ref: '#/components/schemas/RiskLevel' }
        - name: reviewed
          in: query
          required: false
          schema: { type: boolean }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 판정 페이지
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/OperatorAssessmentPage' }
                  error: { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OperatorOnly' }

  /api/v1/operator/assessments/{assessmentId}/reviewed:
    parameters:
      - name: assessmentId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [operator]
      operationId: markAssessmentReviewed
      summary: 판정을 확인함으로 표시 (US4-AC1). 이미 확인했어도 204
      responses:
        '204':
          description: 표시됨
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OperatorOnly' }

  /api/v1/operator/reports:
    get:
      tags: [operator]
      operationId: listReports
      summary: 신고 조회 (US4-AC2). 최신순. 기본은 PENDING
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ReportStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 신고 페이지
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/OperatorReportPage' }
                  error: { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OperatorOnly' }

  /api/v1/operator/reports/{reportId}/decision:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [operator]
      operationId: decideReport
      summary: 신고 닫기 (US4-AC5). 이미 닫힌 신고면 그대로 204
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportDecision' }
      responses:
        '204':
          description: 닫힘
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OperatorOnly' }

  /api/v1/operator/review-requests:
    get:
      tags: [operator]
      operationId: listReviewRequests
      summary: 재검토 요청 조회 (US4-AC8). 최신순. 기본은 PENDING
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ReviewStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 재검토 요청 페이지
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/OperatorReviewPage' }
                  error: { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OperatorOnly' }

  /api/v1/operator/review-requests/{reviewId}/decision:
    parameters:
      - name: reviewId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [operator]
      operationId: decideReview
      summary: 재검토 닫기 (US4-AC3, AC9). RESTORE면 숨김을 풀고, KEEP이면 유지한다. 작성자에게 알림이 간다
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewDecision' }
      responses:
        '204':
          description: 닫힘
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OperatorOnly' }

  /api/v1/operator/contents/{targetType}/{targetId}/hidden:
    parameters:
      - $ref: '#/components/parameters/TargetType'
      - $ref: '#/components/parameters/TargetId'
    put:
      tags: [operator]
      operationId: hideContent
      summary: 대상 숨기기 (US4-AC4). 그 대상의 열린 신고를 모두 처리됨으로 닫는다. 이미 숨겨져 있어도 204
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorNote' }
      responses:
        '204':
          description: 숨김
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OperatorOnly' }
    delete:
      tags: [operator]
      operationId: unhideContent
      summary: 숨김 풀기 (US4-AC3). 작성자에게 알림이 간다. 열린 재검토 요청은 RESTORED로 닫는다. 숨겨져 있지 않아도 204
      responses:
        '204':
          description: 다시 보임
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OperatorOnly' }

  /api/v1/operator/terms:
    get:
      tags: [operator]
      operationId: listTerms
      summary: 낱말 목록 (FR-002, FR-014)
      parameters:
        - name: kind
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TermKind' }
      responses:
        '200':
          description: 낱말 목록
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Term' }
                  error: { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OperatorOnly' }
    post:
      tags: [operator]
      operationId: addTerm
      summary: 낱말 더하기. 모든 인스턴스에 퍼지기까지 최대 30초. 이미 있으면 그대로 200
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TermRequest' }
      responses:
        '200':
          description: 더해진 낱말
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/Term' }
                  error: { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OperatorOnly' }

  /api/v1/operator/terms/{termId}:
    parameters:
      - name: termId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [operator]
      operationId: removeTerm
      summary: 낱말 빼기. 없어도 204
      responses:
        '204':
          description: 빠짐
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OperatorOnly' }

  /api/v1/raid:
    get:
      tags: [raid]
      operationId: getRaid
      summary: 지금의 레이드 (US1-AC1, US4-AC3, US5-AC3). 살아 있는 보스가 없으면 가장 최근에 끝난 보스와 다음 보스가 나오는 때
      responses:
        '200':
          description: 레이드 상태. HP를 들고 있는 장치가 내려가 있으면 available이 false이고 값은 마지막 기록이다
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/RaidState' }
                  error: { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/raid/attacks:
    post:
      tags: [raid]
      operationId: attackRaidBoss
      summary: 보스 공격 (US1-AC2~AC6). HP를 1 줄인다. 회원마다 1초에 한 번
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RaidAttackRequest' }
      responses:
        '200':
          description: 받아들임
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/RaidAttackResult' }
                  error: { type: 'null' }
        '400':
          description: 입력 검증 실패 (INVALID_REQUEST)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 보스가 처치됐거나 물러났거나, 요청의 보스가 지금 보스가 아님 (RAID_BOSS_ENDED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: 쿨다운 안 (RAID_COOLDOWN). HP와 기여는 그대로다
          headers:
            Retry-After:
              description: 다시 시도할 수 있을 때까지의 초(올림)
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: HP를 들고 있는 장치가 내려가 있어 공격을 받을 수 없음 (RAID_UNAVAILABLE). 공격은 반영되지 않았다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
