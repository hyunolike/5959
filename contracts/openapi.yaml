  /api/v1/notifications/stream:
    get:
      tags: [notification]
      operationId: streamNotifications
      summary: 실시간 알림 스트림 (US1-AC1~AC8, FR-004~FR-006)
      description: |
        Server-Sent Events. 브라우저가 API 도메인에 바로 붙는다. Bearer는 받지 않고 ticket으로 인증한다.
        CORS는 OGU_SSE_ALLOWED_ORIGINS의 출처만 허용하고 자격 증명은 쓰지 않는다.

        이벤트 형식:
        - `event: notification`, `id: {seq}`, `data: StreamNotificationEvent(JSON)`.
          새 알림이나 묶음 갱신이다. lastEventId 이후 것은 연결 직후 seq 순서로 다시 보낸다.
        - `event: unread-count`, id 없음, `data: StreamUnreadCountEvent(JSON)`. 읽음 처리로 수가 바뀌었을 때.
        - `: hb` 주석 줄. 25초마다 보내는 하트비트다. 중간 장비가 조용한 연결을 끊지 않게 한다.
        - `event: ping`, id 없음, `data: StreamPingEvent(JSON, 빈 객체)`. 하트비트 주석과 같이 25초마다 보낸다.
          브라우저 EventSource는 주석 줄을 스크립트에 알리지 않으므로, 웹은 이 이벤트로 연결이 살아 있는지 본다.
          id가 없어 마지막 이벤트 id를 바꾸지 않는다. 웹은 60초 동안 아무 이벤트도 없으면 닫고 다시 붙는다.
        - `event: raid`, id 없음, `data: RaidLive(JSON)`. topics에 raid가 있는 연결만 받는다(006).
          연결 직후 지금 값을 한 번 받고, 그 뒤로는 바뀔 때마다 1초에 네 번을 넘지 않게 받는다.

        서버는 15분 뒤 연결을 닫는다. 웹은 새 티켓과 마지막 id로 다시 붙는다(research R14).
        회원 한 명의 동시 연결은 5개까지이고, 넘으면 가장 오래된 연결을 닫는다.
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          description: issueStreamTicket이 준 일회용 티켓
          schema: { type: string, maxLength: 64 }
        - name: lastEventId
          in: query
          required: false
          description: 마지막으로 받은 이벤트 id(seq). 새 EventSource는 헤더를 붙일 수 없어 쿼리로 넘긴다
          schema: { type: integer, format: int64, minimum: 0 }
        - name: topics
          in: query
          required: false
          description: 쉼표로 나눈 주제. 지금은 raid 하나다. 모르는 주제는 무시한다(006)
          schema: { type: string, maxLength: 100 }
        - name: Last-Event-ID
          in: header
          required: false
          description: 표준 재연결 헤더. 쿼리와 함께 오면 헤더를 쓴다
          schema: { type: string }
      responses:
        '200':
          description: 스트림 시작
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Accel-Buffering:
              description: 중간 프록시가 스트림을 버퍼에 담지 않게 한다
              schema: { type: string, const: 'no' }
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 텍스트. 각 이벤트의 data는 contentSchema 가운데 하나다
                contentMediaType: application/json
                contentSchema:
                  oneOf:
                    - $ref: '#/components/schemas/StreamNotificationEvent'
                    - $ref: '#/components/schemas/StreamUnreadCountEvent'
                    - $ref: '#/components/schemas/StreamPingEvent'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: 티켓이 없거나, 이미 쓰였거나, 만료됐거나, 발급한 세션이 끝남 (STREAM_TICKET_INVALID)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

