openapi: 3.1.0
info:
  title: 오구오구 API
  version: 0.3.0
  description: |
    apps/api가 이 계약을 구현하고, apps/web은 이 계약에서 타입을 생성한다.
    이 API는 BFF(apps/web의 라우트 핸들러)만 호출한다. 브라우저는 직접 호출하지 않는다.
    모든 응답은 ApiResponse 봉투를 쓴다.
    002-auth에서 추가한 인증과 회원 API는 모두 온보딩 전에도 쓸 수 있다.
    003-core-loop에서 추가한 고민 글, 공감, 댓글, 피드 API는 모두 인증이 필요하고,
    온보딩 전 회원에게는 403 ONBOARDING_REQUIRED를 돌려준다.
servers:
  - url: http://localhost:8080
security:
  - bearer: []
tags:
  - name: auth
    description: 가입, 로그인, 외부 계정 로그인, 세션 갱신, 로그아웃
  - name: member
    description: 내 프로필, 닉네임 확인, 온보딩
  - name: post
    description: 고민 글 작성, 수정, 삭제
  - name: reaction
    description: 공감, 댓글, 댓글 공감
  - name: feed
    description: 피드와 글 상세 조회

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BffKey:
      name: X-Ogu-Bff-Key
      in: header
      required: false
      description: BFF와 API가 공유하는 비밀 키. 맞을 때만 X-Ogu-Client-Ip를 믿는다.
      schema: { type: string }
    ClientIp:
      name: X-Ogu-Client-Ip
      in: header
      required: false
      description: 브라우저의 원래 IP. 로그인 실패 제한에 쓴다.
      schema: { type: string }
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [kakao, google]
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    CommentId:
      name: commentId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: ErrorCode 이름
          examples: [INVALID_CREDENTIALS]
        message:
          type: string
        retryAfterSeconds:
          type: integer
          description: LOGIN_THROTTLED일 때만 있다
    ErrorEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: false }
        data: { type: 'null' }
        error: { $ref: '#/components/schemas/ErrorResponse' }
    JobRole:
      type: string
      enum: [PLANNING, DESIGN, DEVELOPMENT, MARKETING, SALES, HR, GENERAL_AFFAIRS, PRODUCTION, ACCOUNTING, OTHER]
    CareerYear:
      type: string
      enum: [NEWCOMER, YEAR_1, YEAR_2, YEAR_3, YEAR_4, YEAR_5, YEAR_6, YEAR_7_PLUS]
    AuthMethod:
      type: string
      enum: [EMAIL, KAKAO, GOOGLE]
    MemberProfile:
      type: object
      required: [id, authMethod, onboarded]
      properties:
        id: { type: integer, format: int64 }
        authMethod: { $ref: '#/components/schemas/AuthMethod' }
        email: { type: [string, 'null'] }
        nickname: { type: [string, 'null'] }
        jobRole:
          oneOf: [{ $ref: '#/components/schemas/JobRole' }, { type: 'null' }]
        careerYear:
          oneOf: [{ $ref: '#/components/schemas/CareerYear' }, { type: 'null' }]
        onboarded: { type: boolean }
    AuthTokens:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken:
          type: [string, 'null']
          description: refresh 유예 구간(교체 후 30초)에서는 null이다. 이때 BFF는 refresh 쿠키를 바꾸지 않는다.
        refreshTokenExpiresAt: { type: string, format: date-time }
    AuthResult:
      type: object
      required: [member, tokens, newMember]
      properties:
        member: { $ref: '#/components/schemas/MemberProfile' }
        tokens: { $ref: '#/components/schemas/AuthTokens' }
        newMember:
          type: boolean
          description: 이번 요청으로 회원이 만들어졌으면 true
    AuthResultEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/AuthResult' }
        error: { type: 'null' }
    MemberProfileEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/MemberProfile' }
        error: { type: 'null' }
    OnboardingResult:
      type: object
      required: [member, accessToken, accessTokenExpiresAt]
      properties:
        member: { $ref: '#/components/schemas/MemberProfile' }
        accessToken:
          type: string
          description: onboarded=true 클레임을 담은 새 access 토큰
        accessTokenExpiresAt: { type: string, format: date-time }
    NicknameAvailability:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        reason:
          type: [string, 'null']
          enum: [INVALID_FORMAT, TAKEN, null]
    EmailPasswordRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 20 }
    CommentTone:
      type: string
      enum: [VENT_WITH_ME, COMFORT_ME, WARM_ADVICE, MAKE_ME_LAUGH]
    EmotionType:
      type: string
      enum: [ANXIETY, LETHARGY, LONELINESS, SELF_DEPRECATION, IRRITATION]
    AnalysisStatus:
      type: string
      enum: [PENDING, ANALYZED, DEFAULTED]
    MonsterView:
      type: object
      required: [emotion, hp, maxHp, status]
      properties:
        emotion: { $ref: '#/components/schemas/EmotionType' }
        hp: { type: integer, minimum: 0 }
        maxHp: { type: integer, enum: [10, 20, 30] }
        status: { type: string, enum: [ALIVE, DEFEATED] }
    Author:
      type: object
      required: [id, nickname, jobRole, careerYear]
      properties:
        id: { type: integer, format: int64 }
        nickname: { type: string }
        jobRole: { $ref: '#/components/schemas/JobRole' }
        careerYear: { $ref: '#/components/schemas/CareerYear' }
    PostWriteRequest:
      type: object
      required: [content, commentTone]
      properties:
        content:
          type: string
          description: 앞뒤 공백을 뺀 글자(grapheme) 1~500자
        commentTone: { $ref: '#/components/schemas/CommentTone' }
    PostUpdateRequest:
      type: object
      minProperties: 1
      properties:
        content: { type: string }
        commentTone: { $ref: '#/components/schemas/CommentTone' }
    PostCreated:
      type: object
      required: [postId, analysisStatus]
      properties:
        postId: { type: integer, format: int64 }
        analysisStatus: { $ref: '#/components/schemas/AnalysisStatus' }
    FeedItem:
      type: object
      required: [postId, author, contentPreview, analysisStatus, likeCount, likedByMe, commentCount, createdAt]
      properties:
        postId: { type: integer, format: int64 }
        author: { $ref: '#/components/schemas/Author' }
        contentPreview:
          type: string
          description: 앞 50글자. 더 길면 끝에 "..."
        analysisStatus: { $ref: '#/components/schemas/AnalysisStatus' }
        monster:
          oneOf: [{ $ref: '#/components/schemas/MonsterView' }, { type: 'null' }]
          description: 분석 중이면 null
        likeCount: { type: integer }
        likedByMe: { type: boolean }
        commentCount: { type: integer }
        createdAt: { type: string, format: date-time }
    FeedPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FeedItem' }
        nextCursor:
          type: [string, 'null']
          description: 다음 페이지가 없으면 null. 불투명 문자열
    PostDetail:
      type: object
      required: [postId, author, content, commentTone, analysisStatus, likeCount, likedByMe, commentCount, mine, createdAt]
      properties:
        postId: { type: integer, format: int64 }
        author: { $ref: '#/components/schemas/Author' }
        content: { type: string }
        commentTone: { $ref: '#/components/schemas/CommentTone' }
        analysisStatus: { $ref: '#/components/schemas/AnalysisStatus' }
        monster:
          oneOf: [{ $ref: '#/components/schemas/MonsterView' }, { type: 'null' }]
        likeCount: { type: integer }
        likedByMe: { type: boolean }
        commentCount: { type: integer }
        mine: { type: boolean, description: 내가 쓴 글이면 true }
        myCommentCounted:
          type: boolean
          description: 내 댓글이 이미 HP에 반영됐으면 true. 웹의 낙관적 HP 계산(research R6)에 쓴다
        createdAt: { type: string, format: date-time }
    Comment:
      type: object
      required: [commentId, author, content, likeCount, likedByMe, mine, createdAt, replies]
      properties:
        commentId: { type: integer, format: int64 }
        author: { $ref: '#/components/schemas/Author' }
        content: { type: string }
        likeCount: { type: integer }
        likedByMe: { type: boolean }
        mine: { type: boolean }
        createdAt: { type: string, format: date-time }
        replies:
          type: array
          description: 답글(오래된 순). 답글의 replies는 항상 빈 배열이다
          items: { $ref: '#/components/schemas/Comment' }
    CommentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: 원 댓글(오래된 순)과 각 답글
          items: { $ref: '#/components/schemas/Comment' }
        nextCursor: { type: [string, 'null'] }
    CommentWriteRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: 앞뒤 공백을 뺀 글자 1~300자
        parentId:
          type: [integer, 'null']
          format: int64
          description: 답글이면 원 댓글 ID
    LikeResult:
      type: object
      required: [likeCount, likedByMe]
      properties:
        likeCount: { type: integer }
        likedByMe: { type: boolean }
  responses:
    BadRequest:
      description: 입력 검증 실패 (INVALID_REQUEST). 댓글 작성에서는 INVALID_PARENT_COMMENT도 쓴다
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: 인증 없음 또는 세션 만료, 무효 (UNAUTHORIZED, SESSION_EXPIRED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: 온보딩 전(ONBOARDING_REQUIRED) 또는 권한 없음(NOT_AUTHOR, CANNOT_LIKE_OWN_POST)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: 없거나 삭제된 글 또는 댓글 (POST_NOT_FOUND, COMMENT_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

paths:
  /api/v1/auth/signup:
    post:
      tags: [auth]
      operationId: signup
      security: []
      summary: 이메일 가입 (US1-AC1~AC3)
      parameters:
        - $ref: '#/components/parameters/BffKey'
        - $ref: '#/components/parameters/ClientIp'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailPasswordRequest' }
      responses:
        '201':
          description: 가입과 동시에 로그인된다. member.onboarded는 false다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResultEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: 이미 가입된 이메일(EMAIL_ALREADY_REGISTERED), 또는 외부 계정 회원이 쓰는 이메일(EMAIL_REGISTERED_WITH_OTHER_METHOD)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      summary: 이메일 로그인 (US2-AC1~AC4)
      parameters:
        - $ref: '#/components/parameters/BffKey'
        - $ref: '#/components/parameters/ClientIp'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailPasswordRequest' }
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResultEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: 이메일 또는 비밀번호가 틀림. 어느 쪽인지 구분하지 않는다 (INVALID_CREDENTIALS)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: 로그인 실패 제한에 걸림 (LOGIN_THROTTLED). error.retryAfterSeconds와 Retry-After 헤더가 있다
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/auth/oauth/{provider}:
    post:
      tags: [auth]
      operationId: oauthLogin
      security: []
      summary: 외부 계정 인가 코드 교환과 로그인 (US3-AC1~AC3)
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/BffKey'
        - $ref: '#/components/parameters/ClientIp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, redirectUri]
              properties:
                code: { type: string }
                redirectUri:
                  type: string
                  format: uri
                  description: 인가 요청에 쓴 redirect_uri와 같아야 한다. API는 허용 목록과 대조한다
                codeVerifier:
                  type: [string, 'null']
                  description: PKCE를 쓴 경우에만 보낸다
      responses:
        '200':
          description: 로그인 성공. 처음이면 newMember=true, member.onboarded=false
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResultEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: 제공자가 코드를 거절함 (OAUTH_CODE_INVALID)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: 같은 이메일이 이메일 가입으로 이미 쓰임 (EMAIL_REGISTERED_WITH_OTHER_METHOD)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502':
          description: 제공자가 응답하지 않음 (OAUTH_PROVIDER_UNAVAILABLE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      security: []
      summary: 세션 갱신 (US4-AC1~AC3)
      parameters:
        - $ref: '#/components/parameters/BffKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 새 토큰. 유예 구간에서는 tokens.refreshToken이 null
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResultEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 현재 세션 무효화 (US2-AC5)
      security: [{ bearer: [] }]
      responses:
        '204':
          description: 세션이 무효가 되었다. 이미 무효이거나 만료된 세션의 토큰은 401이다(BFF는 결과와 관계없이 쿠키를 지운다)
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/members/me:
    get:
      tags: [member]
      operationId: getMe
      summary: 내 프로필 (FR-015). 온보딩 전에도 호출할 수 있다
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 내 프로필
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberProfileEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/members/nickname-availability:
    get:
      tags: [member]
      operationId: checkNickname
      summary: 닉네임 사용 가능 여부 (US1-AC5, US1-AC6)
      security: [{ bearer: [] }]
      parameters:
        - name: nickname
          in: query
          required: true
          schema: { type: string, maxLength: 50 }
      responses:
        '200':
          description: 사용 가능 여부
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/NicknameAvailability' }
                  error: { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/members/me/onboarding:
    put:
      tags: [member]
      operationId: completeOnboarding
      summary: 온보딩 완료 (US1-AC4~AC6)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname, jobRole, careerYear]
              properties:
                nickname: { type: string }
                jobRole: { $ref: '#/components/schemas/JobRole' }
                careerYear: { $ref: '#/components/schemas/CareerYear' }
      responses:
        '200':
          description: 온보딩 완료. 새 access 토큰을 함께 준다
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/OnboardingResult' }
                  error: { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 닉네임 중복(NICKNAME_TAKEN) 또는 이미 온보딩함(ALREADY_ONBOARDED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/posts:
    post:
      tags: [post]
      operationId: createPost
      summary: 고민 글 작성 (US1-AC1, AC2). 감정 분석은 비동기
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostWriteRequest' }
      responses:
        '201':
          description: 저장됨. analysisStatus는 PENDING
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PostCreated' }
                  error: { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: 1시간에 10개 초과 (POST_RATE_LIMITED, research R9)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/posts/{postId}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [feed]
      operationId: getPostDetail
      summary: 글 상세 (FR-012, FR-015). 분석 중이면 monster는 null
      responses:
        '200':
          description: 글 상세
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PostDetail' }
                  error: { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [post]
      operationId: updatePost
      summary: 글 수정 (US4-AC1). 몬스터는 바뀌지 않는다
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostUpdateRequest' }
      responses:
        '204': { description: 수정됨 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [post]
      operationId: deletePost
      summary: 글 삭제 (US4-AC2)
      responses:
        '204': { description: 삭제됨 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/feed:
    get:
      tags: [feed]
      operationId: getFeed
      summary: 피드 (US2)
      parameters:
        - name: order
          in: query
          schema: { type: string, enum: [LATEST, POPULAR], default: LATEST }
        - name: jobRole
          in: query
          description: 여러 번 줄 수 있다. 하나라도 맞으면 통과
          schema:
            type: array
            items: { $ref: '#/components/schemas/JobRole' }
          style: form
          explode: true
        - name: careerYear
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/CareerYear' }
          style: form
          explode: true
        - name: cursor
          in: query
          schema: { type: string }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
