services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  api:
    image: ghcr.io/hyunolike/5959-api:${API_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # deploy.sh 헬스 체크용. 외부 노출은 Caddy만 한다
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      OGU_BFF_KEY: ${OGU_BFF_KEY}
      OAUTH_ALLOWED_REDIRECT_URIS: ${OAUTH_ALLOWED_REDIRECT_URIS}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      AI_BASE_URL: ${AI_BASE_URL:-https://integrate.api.nvidia.com/v1}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-qwen/qwen3-next-80b-a3b-instruct}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
      OTEL_SERVICE_NAME: ogu-api
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production,service.version=${API_TAG}
      # 004 실시간 알림(research R5). REDIS_URL이 없거나 localhost면, OGU_SSE_ALLOWED_ORIGINS가 비면 기동하지 않는다
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OGU_SSE_ALLOWED_ORIGINS: ${OGU_SSE_ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      # Redis 장애가 API 기동을 막지 않게 컨테이너가 뜨기만 기다린다(service_healthy를 쓰지 않는다)
      redis:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # 004 실시간 알림의 인스턴스 간 신호만 나른다(research R5). 키를 저장하지 않아 디스크에 쓰지 않고,
  # 포트를 열지 않아 compose 내부 네트워크의 api만 붙는다.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD}
      --maxmemory 64mb --maxmemory-policy noeviction
      --save "" --appendonly no
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 10

volumes:
  caddy-data:
  caddy-config:
  pg-data:
