services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    mem_limit: 96m
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/ogu/caddy-data:/data
      - /var/lib/ogu/caddy-config:/config
    depends_on: [api]
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  api:
    image: ${API_IMAGE:?required}
    restart: unless-stopped
    mem_limit: 1024m
    ports: ["127.0.0.1:8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      OGU_BFF_KEY: ${OGU_BFF_KEY}
      OAUTH_ALLOWED_REDIRECT_URIS: ${OAUTH_ALLOWED_REDIRECT_URIS}
      KAKAO_LOGIN_ENABLED: ${KAKAO_LOGIN_ENABLED:-true}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      AI_BASE_URL: ${AI_BASE_URL:-https://integrate.api.nvidia.com/v1}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-20b}
      AI_RISK_MODEL: ${AI_RISK_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      AI_COMPANION_ENABLED: ${AI_COMPANION_ENABLED:-false}
      AI_COMPANION_DAILY_LIMIT: ${AI_COMPANION_DAILY_LIMIT:-45}
      AI_COMPANION_WAIT: ${AI_COMPANION_WAIT:-10m}
      # 012: 한 글에 반응할 AI 친구의 수(1명, 2명, 3명)를 뽑는 무게와, 다음 친구가 오기까지의 간격
      AI_COMPANION_COUNT_WEIGHTS: ${AI_COMPANION_COUNT_WEIGHTS:-60,30,10}
      AI_COMPANION_FOLLOW_UP_MIN: ${AI_COMPANION_FOLLOW_UP_MIN:-3m}
      AI_COMPANION_FOLLOW_UP_MAX: ${AI_COMPANION_FOLLOW_UP_MAX:-10m}
      # 012: 조용할 때 AI 친구가 고민 글을 쓴다. 반응과 따로 켜고, 꺼진 채로 나간다
      AI_COMPANION_POSTING_ENABLED: ${AI_COMPANION_POSTING_ENABLED:-false}
      AI_COMPANION_POSTING_QUIET: ${AI_COMPANION_POSTING_QUIET:-6h}
      AI_COMPANION_POSTING_DAILY_POSTS: ${AI_COMPANION_POSTING_DAILY_POSTS:-3}
      # 015: 비밀번호 재설정 메일. 꺼진 채로 나간다. 켜는 방법은 specs/015-password-reset/quickstart.md
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      OGU_WEB_ORIGIN: ${OGU_WEB_ORIGIN:-}
      REDIS_URL: ${REDIS_URL}
      OGU_SSE_ALLOWED_ORIGINS: ${OGU_SSE_ALLOWED_ORIGINS}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    logging: *logging

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    mem_limit: 384m
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=32MB"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /var/lib/ogu/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 128m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    logging: *logging
