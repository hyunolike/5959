# 011-guest-feed가 루트 계약(contracts/openapi.yaml)에 더하는 것. 구현 전에 루트에 합친다(0.12.0).
openapi: 3.1.0
info:
  title: 오구오구 API - 비회원 둘러보기 피드
  version: 0.12.0
paths:
  /api/v1/public/feed:
    get:
      operationId: getPublicFeed
      summary: 로그인하지 않은 방문자가 보는 최근 글 (011 US1, US2)
      tags: [feed]
      security: []
      responses:
        '200':
          description: 최근 글 최대 20개. 넘겨 볼 수 없다. 보일 수 있는 글이 없으면 빈 목록이다
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PublicFeed' }
                  error: { type: 'null' }
components:
  schemas:
    PublicFeedItem:
      type: object
      description: |
        로그인하지 않은 방문자에게 보이는 글 하나. 닉네임, 회원 번호, 댓글의 내용, 공감한 회원이 들어갈 자리가 없다(011 FR-003).
        지운 글, 숨긴 글, 위험 단계가 없음이 아닌 글, 위험 판정이 끝나지 않은 글은 나오지 않는다(011 FR-004).
      required: [postId, jobRole, careerYear, contentPreview, analysisStatus, monster, likeCount, commentCount, createdAt]
      properties:
        postId: { type: integer, format: int64, description: 로그인한 뒤 이 글로 가는 데 쓴다 }
        jobRole: { $ref: '#/components/schemas/JobRole' }
        careerYear: { $ref: '#/components/schemas/CareerYear' }
        contentPreview: { type: string, description: 욕설을 가린 본문의 앞부분 }
        analysisStatus: { $ref: '#/components/schemas/AnalysisStatus' }
        monster:
          oneOf: [{ $ref: '#/components/schemas/MonsterView' }, { type: 'null' }]
        likeCount: { type: integer, minimum: 0 }
        commentCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    PublicFeed:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/PublicFeedItem' }
