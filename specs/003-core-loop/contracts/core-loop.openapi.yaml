openapi: 3.1.0
info:
  title: 오구오구 API - 핵심 루프 (003 추가분)
  version: 0.3.0
  description: |
    003-core-loop에서 추가하는 경로와 스키마다. 구현 첫 작업에서 저장소 루트의
    contracts/openapi.yaml(누적 계약)에 합친다(research R13). 이 파일은 리뷰와 검증용으로
    단독으로도 유효하게 두며, ErrorEnvelope, JobRole, CareerYear는 루트 계약의 정의와 같다.
    모든 경로는 인증이 필요하고, 온보딩 전 회원에게는 403 ONBOARDING_REQUIRED를 돌려준다.
servers:
  - url: http://localhost:8080
tags:
  - name: post
    description: 고민 글 작성, 수정, 삭제
  - name: reaction
    description: 공감, 댓글, 댓글 공감
  - name: feed
    description: 피드와 글 상세 조회
security:
  - bearer: []

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    CommentId:
      name: commentId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        retryAfterSeconds: { type: integer }
    ErrorEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: false }
        data: { type: 'null' }
        error: { $ref: '#/components/schemas/ErrorResponse' }
    JobRole:
      type: string
      enum: [PLANNING, DESIGN, DEVELOPMENT, MARKETING, SALES, HR, GENERAL_AFFAIRS, PRODUCTION, ACCOUNTING, OTHER]
    CareerYear:
      type: string
      enum: [NEWCOMER, YEAR_1, YEAR_2, YEAR_3, YEAR_4, YEAR_5, YEAR_6, YEAR_7_PLUS]
    CommentTone:
      type: string
      enum: [VENT_WITH_ME, COMFORT_ME, WARM_ADVICE, MAKE_ME_LAUGH]
    EmotionType:
      type: string
      enum: [ANXIETY, LETHARGY, LONELINESS, SELF_DEPRECATION, IRRITATION]
    AnalysisStatus:
      type: string
      enum: [PENDING, ANALYZED, DEFAULTED]
    MonsterView:
      type: object
      required: [emotion, hp, maxHp, status]
      properties:
        emotion: { $ref: '#/components/schemas/EmotionType' }
        hp: { type: integer, minimum: 0 }
        maxHp: { type: integer, enum: [10, 20, 30] }
        status: { type: string, enum: [ALIVE, DEFEATED] }
    Author:
      type: object
      required: [id, nickname, jobRole, careerYear]
      properties:
        id: { type: integer, format: int64 }
        nickname: { type: string }
        jobRole: { $ref: '#/components/schemas/JobRole' }
        careerYear: { $ref: '#/components/schemas/CareerYear' }
    PostWriteRequest:
      type: object
      required: [content, commentTone]
      properties:
        content:
          type: string
          description: 앞뒤 공백을 뺀 글자(grapheme) 1~500자
        commentTone: { $ref: '#/components/schemas/CommentTone' }
    PostUpdateRequest:
      type: object
      minProperties: 1
      properties:
        content: { type: string }
        commentTone: { $ref: '#/components/schemas/CommentTone' }
    PostCreated:
      type: object
      required: [postId, analysisStatus]
      properties:
        postId: { type: integer, format: int64 }
        analysisStatus: { $ref: '#/components/schemas/AnalysisStatus' }
    FeedItem:
      type: object
      required: [postId, author, contentPreview, analysisStatus, likeCount, likedByMe, commentCount, createdAt]
      properties:
        postId: { type: integer, format: int64 }
        author: { $ref: '#/components/schemas/Author' }
        contentPreview:
          type: string
          description: 앞 50글자. 더 길면 끝에 "..."
        analysisStatus: { $ref: '#/components/schemas/AnalysisStatus' }
        monster:
          oneOf: [{ $ref: '#/components/schemas/MonsterView' }, { type: 'null' }]
          description: 분석 중이면 null
        likeCount: { type: integer }
        likedByMe: { type: boolean }
        commentCount: { type: integer }
        createdAt: { type: string, format: date-time }
    FeedPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FeedItem' }
        nextCursor:
          type: [string, 'null']
          description: 다음 페이지가 없으면 null. 불투명 문자열
    PostDetail:
      type: object
      required: [postId, author, content, commentTone, analysisStatus, likeCount, likedByMe, commentCount, mine, createdAt]
      properties:
        postId: { type: integer, format: int64 }
        author: { $ref: '#/components/schemas/Author' }
        content: { type: string }
        commentTone: { $ref: '#/components/schemas/CommentTone' }
        analysisStatus: { $ref: '#/components/schemas/AnalysisStatus' }
        monster:
          oneOf: [{ $ref: '#/components/schemas/MonsterView' }, { type: 'null' }]
        likeCount: { type: integer }
        likedByMe: { type: boolean }
        commentCount: { type: integer }
        mine: { type: boolean, description: 내가 쓴 글이면 true }
        myCommentCounted:
          type: boolean
          description: 내 댓글이 이미 HP에 반영됐으면 true. 웹의 낙관적 HP 계산(research R6)에 쓴다
        createdAt: { type: string, format: date-time }
    Comment:
      type: object
      required: [commentId, author, content, likeCount, likedByMe, mine, createdAt, replies]
      properties:
        commentId: { type: integer, format: int64 }
        author: { $ref: '#/components/schemas/Author' }
        content: { type: string }
        likeCount: { type: integer }
        likedByMe: { type: boolean }
        mine: { type: boolean }
        createdAt: { type: string, format: date-time }
        replies:
          type: array
          description: 답글(오래된 순). 답글의 replies는 항상 빈 배열이다
          items: { $ref: '#/components/schemas/Comment' }
    CommentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: 원 댓글(오래된 순)과 각 답글
          items: { $ref: '#/components/schemas/Comment' }
        nextCursor: { type: [string, 'null'] }
    CommentWriteRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: 앞뒤 공백을 뺀 글자 1~300자
        parentId:
          type: [integer, 'null']
          format: int64
          description: 답글이면 원 댓글 ID
    LikeResult:
      type: object
      required: [likeCount, likedByMe]
      properties:
        likeCount: { type: integer }
        likedByMe: { type: boolean }
  responses:
    BadRequest:
      description: 입력 검증 실패 (INVALID_REQUEST, INVALID_PARENT_COMMENT)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: 인증 없음 또는 세션 만료
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: 온보딩 전(ONBOARDING_REQUIRED) 또는 권한 없음(NOT_AUTHOR, CANNOT_LIKE_OWN_POST)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: 없거나 삭제된 글 또는 댓글 (POST_NOT_FOUND, COMMENT_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

paths:
  /api/v1/posts:
    post:
      tags: [post]
      operationId: createPost
      summary: 고민 글 작성 (US1-AC1, AC2). 감정 분석은 비동기
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostWriteRequest' }
      responses:
        '201':
          description: 저장됨. analysisStatus는 PENDING
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PostCreated' }
                  error: { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: 1시간에 10개 초과 (POST_RATE_LIMITED, research R9)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/posts/{postId}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [feed]
      operationId: getPostDetail
      summary: 글 상세 (FR-012, FR-015). 분석 중이면 monster는 null
      responses:
        '200':
          description: 글 상세
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PostDetail' }
                  error: { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [post]
      operationId: updatePost
      summary: 글 수정 (US4-AC1). 몬스터는 바뀌지 않는다
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostUpdateRequest' }
      responses:
        '204': { description: 수정됨 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [post]
      operationId: deletePost
      summary: 글 삭제 (US4-AC2)
      responses:
        '204': { description: 삭제됨 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/feed:
    get:
      tags: [feed]
      operationId: getFeed
      summary: 피드 (US2)
      parameters:
        - name: order
          in: query
          schema: { type: string, enum: [LATEST, POPULAR], default: LATEST }
        - name: jobRole
          in: query
          description: 여러 번 줄 수 있다. 하나라도 맞으면 통과
          schema:
            type: array
            items: { $ref: '#/components/schemas/JobRole' }
          style: form
          explode: true
        - name: careerYear
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/CareerYear' }
          style: form
          explode: true
        - name: cursor
          in: query
          schema: { type: string }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: 피드 페이지
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/FeedPage' }
                  error: { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/posts/{postId}/likes:
    parameters:
      - $ref: '#/components/parameters/PostId'
    post:
      tags: [reaction]
      operationId: likePost
      summary: 글 공감 (US3-AC1, US3-AC8)
      responses:
        '200':
          description: 공감됨
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/LikeResult' }
                  error: { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 공감함 (ALREADY_LIKED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/posts/{postId}/likes/me:
    parameters:
      - $ref: '#/components/parameters/PostId'
    delete:
      tags: [reaction]
      operationId: unlikePost
      summary: 글 공감 취소 (US3-AC6). HP는 돌아오지 않는다
      responses:
        '200':
          description: 취소됨. 공감하지 않은 상태여도 200
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/LikeResult' }
                  error: { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/posts/{postId}/comments:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [reaction]
      operationId: getComments
      summary: 댓글 목록. 원 댓글 50개씩, 답글은 원 댓글 아래에 모두
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 댓글 페이지
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/CommentPage' }
                  error: { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [reaction]
      operationId: createComment
      summary: 댓글 또는 답글 작성 (US3-AC2, AC3)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentWriteRequest' }
      responses:
        '201':
          description: 작성됨
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/Comment' }
                  error: { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/CommentId'
    patch:
      tags: [reaction]
      operationId: updateComment
      summary: 댓글 수정 (US4-AC3)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        '204': { description: 수정됨 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [reaction]
      operationId: deleteComment
      summary: 댓글 삭제 (US4-AC3). 원 댓글이면 답글도 함께 삭제
      responses:
        '204': { description: 삭제됨 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/comments/{commentId}/likes:
    parameters:
      - $ref: '#/components/parameters/CommentId'
    post:
      tags: [reaction]
      operationId: likeComment
      summary: 댓글 공감 (US3-AC4)
      responses:
        '200':
          description: 공감됨
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/LikeResult' }
                  error: { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 공감함 (ALREADY_LIKED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/comments/{commentId}/likes/me:
    parameters:
      - $ref: '#/components/parameters/CommentId'
    delete:
      tags: [reaction]
      operationId: unlikeComment
      summary: 댓글 공감 취소 (US3-AC6)
      responses:
        '200':
          description: 취소됨
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/LikeResult' }
                  error: { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
