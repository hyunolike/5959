# 012-companion-activity가 루트 계약(contracts/openapi.yaml)에 더하는 것. PR 2의 구현 전에 루트에 합친다(0.13.0).
# 새 경로와 새 오류 코드는 없다. 글의 작성자를 싣는 스키마 둘이 바뀐다.
# PR 1(여러 친구의 반응)은 계약을 바꾸지 않는다. 댓글이 늘 뿐 응답의 모양은 그대로다.
openapi: 3.1.0
info:
  title: 오구오구 API - AI 친구의 활동 넓히기
  version: 0.13.0
paths: {}
components:
  schemas:
    # 바뀌는 스키마
    Author:
      type: object
      description: |
        글을 쓴 회원. 직군과 경력은 글을 쓸 때의 스냅숏이다.
        AI 친구가 쓴 글(ai = true)은 직군과 경력이 null이다. 웹은 그 자리에 "AI 친구"를 보인다(US4-AC1, FR-029).
        피드, 글 상세, 비슷한 글, 내가 쓴 글, 공감한 글이 함께 쓴다.
      required: [id, nickname, jobRole, careerYear, ai]
      properties:
        id: { type: integer, format: int64 }
        nickname: { type: string }
        jobRole:
          oneOf: [{ $ref: '#/components/schemas/JobRole' }, { type: 'null' }]
          description: AI 친구의 글이면 null
        careerYear:
          oneOf: [{ $ref: '#/components/schemas/CareerYear' }, { type: 'null' }]
          description: AI 친구의 글이면 null
        ai:
          type: boolean
          description: AI 친구가 쓴 글이면 true. 글을 쓸 때의 글쓴이 종류다
    PublicFeedItem:
      type: object
      description: |
        로그인하지 않은 방문자에게 보이는 글 하나. 닉네임, 회원 번호, 댓글의 내용, 공감한 회원이 들어갈 자리가 없다(011 FR-003).
        AI 친구가 쓴 글(ai = true)도 같은 조건으로 나오고 직군과 경력이 null이다. 닉네임은 여전히 없다(US4-AC3, FR-031).
      required: [postId, jobRole, careerYear, ai, contentPreview, analysisStatus, monster, likeCount, commentCount, createdAt]
      properties:
        postId: { type: integer, format: int64 }
        jobRole:
          oneOf: [{ $ref: '#/components/schemas/JobRole' }, { type: 'null' }]
        careerYear:
          oneOf: [{ $ref: '#/components/schemas/CareerYear' }, { type: 'null' }]
        ai: { type: boolean }
        contentPreview: { type: string }
        analysisStatus: { $ref: '#/components/schemas/AnalysisStatus' }
        monster:
          oneOf: [{ $ref: '#/components/schemas/MonsterView' }, { type: 'null' }]
        likeCount: { type: integer, minimum: 0 }
        commentCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    # 아래는 루트 계약에 이미 있다. 이 조각이 혼자 읽히게 이름만 둔다.
    JobRole: { type: string }
    CareerYear: { type: string }
    AnalysisStatus: { type: string }
    MonsterView: { type: object }
