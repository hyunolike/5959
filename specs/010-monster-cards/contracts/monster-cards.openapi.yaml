# 010-monster-cards가 루트 계약(contracts/openapi.yaml)에 더하는 것. 구현 전에 루트에 합친다(0.10.0).
openapi: 3.1.0
info:
  title: 오구오구 API - 몬스터 도감
  version: 0.10.0
paths:
  /api/v1/members/me/monster-cards:
    get:
      operationId: getMyMonsterCards
      summary: 내 몬스터 카드, 최근에 물리친 것부터 (010 US1, US2, US4)
      tags: [mypage]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: 앞 쪽의 nextCursor
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: emotion
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EmotionType' }
          description: 이 감정의 카드만. 요약은 거르기 전의 전체다
      responses:
        '200':
          description: 카드가 없으면 빈 목록이고 요약의 수는 모두 0이다
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/MonsterCardPage' }
                  error: { type: 'null' }
        '400': { description: 커서, 크기, 감정이 올바르지 않다(INVALID_REQUEST) }
        '401': { description: 로그인하지 않았다 }
        '403': { description: 온보딩을 마치지 않았다 }
components:
  schemas:
    MonsterCardGrade:
      type: string
      description: 몬스터의 세기로 정해진다. COMMON 일반(HP 10), RARE 희귀(HP 20), LEGENDARY 전설(HP 30). 무작위가 아니다
      enum: [COMMON, RARE, LEGENDARY]
    MonsterCardRole:
      type: string
      description: MINE 내 글의 몬스터, TOGETHER 다른 회원의 몬스터를 내가 HP를 줄여 함께 물리쳤다
      enum: [MINE, TOGETHER]
    MonsterCard:
      type: object
      description: |
        처치된 몬스터 하나. 지우지도 숨기지도 않은 글의 몬스터만 카드가 된다.
        글의 본문, 미리보기, 글쓴이, 함께 물리친 회원이 누구인지는 싣지 않는다(010 FR-007).
      required: [cardNo, emotion, grade, role, defeatedAt, myDamage, helperCount, postId]
      properties:
        cardNo: { type: integer, format: int64, description: 몬스터의 고유 번호. 바뀌지 않는다 }
        emotion: { $ref: '#/components/schemas/EmotionType' }
        grade: { $ref: '#/components/schemas/MonsterCardGrade' }
        role: { $ref: '#/components/schemas/MonsterCardRole' }
        defeatedAt: { type: string, format: date-time }
        myDamage: { type: integer, minimum: 0, description: 내가 줄인 HP. MINE이면 0이다 }
        helperCount:
          type: [integer, 'null']
          minimum: 1
          description: HP를 줄인 회원 수. MINE일 때만 있다
        postId: { type: integer, format: int64, description: 이 몬스터의 글. 지금 보이는 글이다 }
    MonsterCardSummary:
      type: object
      required: [total, byEmotion]
      properties:
        total: { type: integer, minimum: 0 }
        byEmotion:
          type: array
          description: 모든 감정이 정해진 순서로 들어 있다. 없는 감정은 0이다
          items: { $ref: '#/components/schemas/EmotionCount' }
    MonsterCardPage:
      type: object
      required: [items, nextCursor, summary]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MonsterCard' }
        nextCursor: { type: [string, 'null'] }
        summary: { $ref: '#/components/schemas/MonsterCardSummary' }
