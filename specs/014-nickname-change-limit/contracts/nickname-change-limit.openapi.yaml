# 014-nickname-change-limit이 루트 계약(contracts/openapi.yaml)에 더하는 것. 구현 전에 루트에 합친다(0.15.0).
openapi: 3.1.0
info:
  title: 오구오구 API - 닉네임 변경 제한
  version: 0.15.0
paths:
  /api/v1/members/me:
    patch:
      operationId: updateMyProfile
      responses:
        '409':
          description: |
            닉네임 중복, 대소문자만 다른 경우 포함 (NICKNAME_TAKEN). 또는 닉네임을 바꾼 지 30일이 지나지 않았다
            (NICKNAME_CHANGE_LIMITED, 014). 제한 중에도 직군과 경력, 지금과 같은 닉네임은 받는다.
components:
  schemas:
    MemberProfile:
      properties:
        nicknameChangeAvailableAt:
          type: [string, 'null']
          format: date-time
          description: |
            닉네임을 다시 바꿀 수 있게 되는 때(014). null이거나 지난 때면 지금 바꿀 수 있다. 닉네임을 바꾸면 30일 뒤로 잡힌다.
            온보딩에서 처음 정한 닉네임은 세지 않는다.
