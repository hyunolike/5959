# 015-password-reset이 루트 계약(contracts/openapi.yaml)에 더하는 것. 구현 전에 루트에 합친다(0.16.0).
openapi: 3.1.0
info:
  title: 오구오구 API - 비밀번호 재설정
  version: 0.16.0
paths:
  /api/v1/auth/password-reset:
    get:
      tags: [auth]
      operationId: getPasswordResetAvailability
      summary: 비밀번호 재설정을 쓸 수 있는지 (015 US4-AC1, AC3)
      security: []
      responses:
        '200':
          description: 메일 발송이 켜져 있으면 available이 true다
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PasswordResetAvailability' }
                  error: { type: 'null' }
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: 비밀번호 재설정 메일 요청 (015 US1, US3)
      description: |
        가입한 이메일이든 아니든 204다. 이메일로 가입했고 탈퇴하지 않은 회원에게만 뒤에서 메일이 간다(015 FR-002, FR-003).
        같은 이메일로 한 시간에 세 번을 넘으면 응답은 같고 보내지 않는다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '204':
          description: 받았다. 메일이 갔는지는 알려 주지 않는다
        '400': { $ref: '#/components/responses/BadRequest' }
        '429':
          description: 같은 곳에서 너무 자주 요청했다 (PASSWORD_RESET_THROTTLED). error.retryAfterSeconds와 Retry-After 헤더가 있다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: 메일 발송이 꺼져 있다 (PASSWORD_RESET_UNAVAILABLE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: 링크의 값으로 새 비밀번호를 정한다 (015 US2)
      description: |
        성공하면 그 회원의 모든 세션이 끝난다. 로그인시키지 않는다. 쓸 수 없는 링크는 까닭을 가르지 않고 같은 400이다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '204':
          description: 비밀번호를 바꿨다
        '400':
          description: 비밀번호가 규칙에 맞지 않는다 (INVALID_REQUEST). 또는 링크를 쓸 수 없다 (PASSWORD_RESET_LINK_INVALID)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
components:
  schemas:
    PasswordResetAvailability:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string }
    PasswordResetConfirmRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, description: 메일의 링크에 든 값 }
        password: { type: string, description: 영문과 숫자를 포함한 8~20자. 가입과 같은 규칙이다 }
